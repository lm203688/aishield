name: Prepare test environment
description: >-
  跑本仓测试套件的**唯一**前置入口：Python + 第三方依赖（cryptography / pyyaml）
  + （可选）MCP 依赖。任何执行 `python tests/run_all.py` 的 job 都必须先引用本
  action —— 由 scripts/validate_workflows.py 的 E11 强制。

# ── 为什么需要这个 action ──────────────────────────────────────────────
# 【2026-10-05 事故】同一件事（"跑全量测试要装什么"）在 6 个 workflow 里各自
# 实现，其中 5 个漏了 cryptography。后果不是"少装一个包"，而是**连锁停摆**：
#
#   threat-intel-feed 的 verify job 裸跑 run_all.py
#     → 干净 runner 上 eco/crypto_sign.py 静默降级 hmac-sha256
#     → L1 可移植身份 / L3 意图授权用例集体 fail-closed 报红（实测 18F/9E）
#     → 该 job 失败 → spine 在 job 2 终止
#     → 其后 8 个 job（规则晋升 / 自扫描 / CI 验证 / 部署 / 分发 / 汇报）全部 skipped
#     → meta_monitor 报「5 个状态域停摆」，而真实根因只有 1 个
#
# 更隐蔽的是**递进式复现**：spine 是串行的，修好 job 2 之后，job 3
# （rule-promoter，同样裸跑 run_all.py）当天就会以完全相同的方式失败，spine 改停在
# job 3。逐个补 = 一天推进一格，永远追不上。另 3 处（feature-closed-loop /
# publish-npm / self-heal-closed-loop）各有独立 cron，会各自静默失败。
#
# 所以修法不是"补 pip install"，而是把前置**定义一次**，再由门禁保证没有人绕过。

# ── 为什么 cryptography 是硬前提而不是可选增强 ────────────────────────
# scanner/runtime 的对外承诺是**零依赖**（仓库刻意不建 requirements.txt，
# ci.yml 的 dependency-check job 见到该文件直接 exit 1）。但**测试**不是 runtime：
# L1「可移植身份」= JWKS 只发非对称公钥、第三方仅凭公钥离线验签；L3「意图授权」=
# AP2 对齐的 Intent Mandate。这两项能力本身建立在 Ed25519 上，降级成 hmac-sha256
# 时它们**根本不存在**（对称密钥无法公开分发，签出来的凭证没人能独立验证）。
#
# 测试用例在这些前提下会照常加载、然后成片失败 —— 失败信息看起来像产品回归，
# 实际是"这台机器没装包"。这类"测试存在与否取决于环境"的状态，比测试失败更危险。
# 故此处 fail-closed：装不上就明确报错退出，绝不降级为 skip（skip 就是假绿）。

# ── 为什么 pyyaml 也在里面（2026-10-05 同日，同一类缺陷的第二次复现）───────
# 把前置收敛到本 action 之后，同一轮里测试新增了 31 个用例（解析 YAML 结构、
# 断言 action 的键与默认值），测试套件因此多出一个第三方依赖 pyyaml —— 而本
# action 只声明了 cryptography。后果与上次同型，只是换了个包：
#
#   threat-intel-feed 的 verify job 在干净 runner 上
#     → Ran 1968 tests / failures=10 / errors=1 / skipped=29（本地只有 3 skip）
#     → 差额正好是那 31 个新用例：yaml 缺失时它们不是失败而是**静默跳过**
#     → spine 再次停在 job 2
#
# 教训：**收敛到一处之后，那一处的内容必须是派生出来的，而不是靠人记得同步。**
# 否则收敛只是把「N 个漏点」换成「1 个漏点」，漏的形式从"改 6 个文件"变成
# "改 1 个文件但没人提醒你"。所以 scripts/validate_workflows.py 增加了 E12：
# 从 tests/ 出发沿本仓 import 图做闭包，**推导**测试真正依赖的第三方包，再与
# 下面这行 pip install 做双向 diff（漏装 = E12 报错，多装 = W6 警告）。
# 换言之：下面这行是**被门禁读取的声明**，改依赖时改它，E12 会立刻告诉你有没有漏。

inputs:
  python-version:
    description: >-
      Python 版本，默认 3.13（本仓绝大多数 job 用的版本，也是 ci.yml 测试 job 的版本）。
      之所以留这个入参：少数 job（meta-monitor / unified-security-scan）刻意用 3.11
      做兼容性覆盖，把它们硬改成 3.13 等于顺手改掉别人的验证范围。
      入参是为了**保留既有意图**，不是鼓励各 job 各自定版本。
    required: false
    default: '3.13'

  install-node-deps:
    description: >-
      是否安装 mcp-server 的 npm 依赖。stdio 端到端测试要真的启动 node 子进程，
      没有它那几个用例会**跳过** —— 跳过就是让「端到端」名存实亡，正是本 action
      要消灭的那种假绿。故默认 true。
      只有调用方自己已经装过（如 publish-npm 的 npm ci）才设 false，省掉重复安装。
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # 调用方需先 actions/checkout —— 下面要 import 本仓的 eco.crypto_sign 来断言后端。
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python test dependencies (hard requirements)
      shell: bash
      run: |
        # ↓↓↓ 这一行是 E12 读取的声明：测试套件 import 的第三方包必须都在这里 ↓↓↓
        # pip 对已满足的包会短路，不会重复下载，所以无需 `if 已装 then 跳过` 分支
        # —— 分支会让「声明」与「实际安装」两件事分叉，正是本 action 要消灭的形态。
        python -m pip install --quiet --disable-pip-version-check cryptography pyyaml

    - name: Assert prerequisites are really in effect (fail-closed)
      shell: bash
      run: |
        # 装完还不够：必须验证**当前进程真的用上了**它。
        # eco/crypto_sign.py 是在 import 时按 cryptography 是否可用来定后端的，
        # 若这一步拿到的仍是 hmac-sha256，说明装的东西没生效（例如装到了别的解释器 /
        # 被 PYTHONPATH 遮蔽），此时继续跑测试只会产出误导性红。
        # 同理 yaml 若 import 不到，run_all.py 里依赖 YAML 的用例会静默跳过 —— 跳过即假绿。
        python - <<'PY'
        import sys
        sys.path.insert(0, '.')
        import yaml  # noqa: F401  （声明即断言：装不上就抛，不降级为 skip）
        from eco import crypto_sign as cs
        backend = cs.backend()
        print(f"pyyaml {yaml.__version__} | 签名后端: {backend} | "
              f"cryptography 可用: {cs.have_crypto()}")
        if backend != cs.ALG_ED25519:
            print("::error::签名后端仍为 %s —— 测试将在错误前提下运行" % backend)
            sys.exit(1)
        PY

    - name: Install mcp-server deps
      if: inputs.install-node-deps == 'true'
      shell: bash
      run: |
        # stdio 端到端测试要真的启动 node 子进程，需要 @modelcontextprotocol/sdk。
        # node_modules 被 gitignore、runner 又是干净环境，不装这一步 E2E 只能跳过，
        # 于是「端到端」名存实亡。装不上时降级为警告而不是让整个 job 失败：
        # 依赖网络/注册表不可用时，不该让一整套 Python 测试陪葬。
        cd mcp-server
        set -o pipefail
        if ! npm ci --no-audit --no-fund 2>&1 | tail -15; then
          echo "::warning::mcp-server 依赖安装失败 —— stdio 端到端测试会自动跳过"
        fi

name: AIShield Unified Security Scan

# 合并自 aishield-scan.yml + security-scan.yml
# 两个 workflow 都是安全扫描，只是目标不同：
#   - self-scan: 扫描自身仓库（push/PR/schedule）
#   - external-scan: 扫描外部工具（schedule/workflow_dispatch + repo_url）

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'eco/**'
      - 'api/**'
  pull_request:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'eco/**'
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repo URL to scan (留空则扫描自身)'
        required: false
        type: string
      tool_type:
        description: 'Tool type'
        required: false
        default: 'mcp'
        type: choice
        options:
          - mcp
          - skill
          - gpt

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  # ── Job 1: 自扫描（自身仓库安全门禁）──────────────────────
  self-scan:
    name: Self-Scan (自身仓库安全门禁)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare scan environment
        uses: ./.github/actions/prepare-tests
        with:
          python-version: '3.11'        # 保留本 job 原有的版本覆盖范围
          install-node-deps: 'false'    # 自扫描不需要 mcp-server 依赖
        # ↑ 本 job 原先**什么都不装**：server 起来后 YAML 策略会静默退回极简
        #   解析器（scanner/policy.py 的 _mini_yaml）、签名后端退回 hmac-sha256。
        #   也就是说「安全门禁自己跑在一个降级环境里」，而它看起来是绿的。
        #   统一走 prepare-tests 后这一层不再依赖调用方的自觉。

      - name: Start AIShield Server
        env:
          # 本 workflow 专用端口。8450 会与并发 workflow / 其它隧道抢 bind，
          # 端口被占时 server 静默启动失败，后续 curl 再空跑，整条门禁就红。
          AISHIELD_PORT: '8731'
        run: |
          set -uo pipefail
          echo "python: $(python -V 2>&1) at $(which python)"
          echo "cwd:  $(pwd)  user: $(whoami)  uid: $(id -u)"
          echo "port: ${AISHIELD_PORT}"

          # ① 语法预检：把 SyntaxError 直接暴露在这一步，而不是埋在 server.log 里。
          python -m py_compile api/server.py api/trust_api.py \
            || { echo "::error::py_compile failed"; exit 1; }

          # ② 导入预检：`import api.server` 只导入不 serve，跑完即退出。
          #    本仓库历史上 6 次连续红灯的根因都在这一步——自研代码在干净
          #    ubuntu-latest 上导入即崩，但本机带 venv 的 Python 3.13 一切正常，
          #    所以必须在这里把 traceback 打到 step 输出里，而不是让它消失在
          #    server.log（GitHub 下载日志需 admin 权限，本 PAT 拿不到）。
          if ! python -c "import api.server" 2>&1 | tee server-import.log; then
            echo "::error::import api.server 失败，traceback 见 server-import.log"
            exit 1
          fi
          echo "import preflight passed (api.server 导入成功)"

          python api/server.py > server.log 2>&1 &
          SERVER_PID=$!
          # 有界就绪探测，最多 30s。原先 `sleep 3` 是一次性赌注：冷启动或
          # 依赖加载稍慢一次就整条链路假失败，而 `curl -s` 不带 --fail，
          # 拿到非 2xx 也不报错，等于把"没起来"伪装成"起来了"。
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${AISHIELD_PORT}/api/v1/health" \
                 -o server-health.json 2>/dev/null; then
              echo "AIShield server ready after ${i}s (pid ${SERVER_PID})"
              cat server-health.json
              exit 0
            fi
            # 进程已经退出了就是真失败，别等满 30s 再报"未就绪"
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::AIShield server 启动即退出 (pid ${SERVER_PID})，日志如下"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::AIShield server 30s 内未就绪，日志如下"
          cat server.log
          exit 1

      - name: Upload server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-diagnostics
          path: |
            server.log
            server-import.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Scan Repository
        env:
          AISHIELD_PORT: '8731'
        run: |
          curl -sf -X POST "http://127.0.0.1:${AISHIELD_PORT}/api/v1/audit" \
            -H "Content-Type: application/json" \
            -d '{
              "tool_name": "aishield-repo",
              "tool_description": "AIShield self-scan of repository",
              "tool_schema": {},
              "source_url": "https://github.com/lm203688/aishield",
              "capabilities": ["scan"]
            }' | tee self-scan-report.json

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: self-scan-report.json

      - name: Check Risk Level
        run: |
          SCORE=$(python3 -c "
          import sys, json
          d = json.load(open('self-scan-report.json'))
          r = d.get('report') or {}
          v = r.get('overall_score', d.get('overall_score', d.get('score')))
          if v is None:
              sys.stderr.write('PARSE_FAIL: keys=%s report_keys=%s\n' % (list(d)[:8], list(r)[:8]))
              sys.exit(3)
          print(int(v))
          ") || {
            echo "::error::门禁自身故障——无法从 self-scan-report.json 解析分数"
            head -c 600 self-scan-report.json || true
            exit 1
          }
          echo "Self-Scan Score: $SCORE"
          if [ "$SCORE" -lt 60 ]; then
            echo "::error::Security score $SCORE is below threshold (60)"
            exit 1
          fi

      - name: Alert on low score
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let score = null;
            try {
              const d = JSON.parse(fs.readFileSync('self-scan-report.json','utf8'));
              score = d.report?.overall_score ?? d.overall_score ?? d.score ?? null;
            } catch(e) {}
            if (score === null) { console.log('无法解析分数，跳过'); return; }
            if (score >= 60) { console.log('安全得分正常:', score); return; }
            // 标题不含 run id：否则每次失败的 run 都是"新标题"，去重永远不命中，
            // 陈旧告警会无限堆积（与 ci.yml 同样的教训）。
            const title = `🔒 安全门禁未通过（AIShield 自扫描）`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (issues.find(i => i.title === title && !i.pull_request)) { console.log('已有告警'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `AIShield 自扫描安全得分 ${score}/100 低于阈值 60。\n运行链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','alert','automated']
            });

      # ── 恢复即关闭：自扫描得分回到阈值以上时，关掉历史告警 ──────────
      # 补齐告警闭环另一半：上面只在失败时开 Issue 不关，修复后（得分回升）
      # Issue 仍长期挂 open，淹没新故障。self-scan 低分时 job 自身 exit 1，
      # 故用 success() 判定"已恢复"。
      - name: Close self-scan alert on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 安全门禁未通过（AIShield 自扫描）';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const ex = issues.find(i => i.title === title && !i.pull_request);
            if (!ex) { console.log('无开启中的自扫描安全告警'); return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ex.number,
              body: `✅ 自扫描安全得分已回到阈值(60)以上（run ${context.runId} @ ${context.sha.slice(0,7)}），自动关闭本告警。`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ex.number, state: 'closed', state_reason: 'completed'
            });
            console.log(`已自动关闭自扫描安全告警 issue #${ex.number}`);

  # ── Job 2: 外部扫描（扫描指定工具）──────────────────────
  external-scan:
    name: External Scan (扫描外部工具)
    runs-on: ubuntu-latest
    if: github.event.inputs.repo_url != '' || github.event.schedule != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AIShield
        run: pip install -e .

      - name: Run Security Scan
        env:
          AISHIELD_API_URL: https://api.aishield.tools
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || '' }}"
          TOOL_TYPE="${{ github.event.inputs.tool_type || 'mcp' }}"
          REPO_NAME="${{ github.repository }}"

          if [ -z "$REPO_URL" ]; then
            echo "No repo_url provided, skipping external scan"
            exit 0
          fi

          echo "Scanning: $REPO_URL"
          python -c "
          import sys, json
          sys.path.insert(0, '.')
          from scanner.engine import scan
          result = scan('$REPO_URL', '$TOOL_TYPE', '$REPO_NAME')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          " > external-scan-report.json 2>external-scan-error.log

      - name: Check if critical issues found
        id: check
        if: hashFiles('external-scan-report.json') != ''
        run: |
          CRITICAL=$(python -c "
          import json
          with open('external-scan-report.json') as f:
              r = json.load(f)
          crit = len([f for f in r.get('findings',[]) if f.get('severity')=='critical'])
          print(crit)
          ")
          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Alert on critical findings
        if: steps.check.outputs.critical_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // 标题稳定（不含 run id），才能被"恢复即关闭"步骤按标题定位并关闭。
            const title = `🛡️ AIShield 扫描发现严重安全问题`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (issues.find(i => i.title === title && !i.pull_request)) { console.log('已有告警'); return; }
            let detail = '';
            try {
              const r = JSON.parse(fs.readFileSync('external-scan-report.json','utf8'));
              const crit = (r.findings||[]).filter(f=>f.severity==='critical');
              detail = crit.map(f=>`- ${f.title||f.name||'issue'}: ${f.description||''}`).join('\n');
            } catch(e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `AIShield 自动扫描发现严重安全问题。\n\n${detail}\n\n运行链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','alert','automated']
            });

      # ── 恢复即关闭：外部扫描未发现 critical 时，关掉历史告警 ──────────
      # 作业内自闭环：external-scan 在 push/PR 时被 job 级 if 跳过，若用独立
      # resolve 作业 needs 它会被"跳过传播"连累，故在每个 job 内自行开关。
      - name: Close external alert on clean scan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ran = fs.existsSync('external-scan-report.json');
            const crit = parseInt('${{ steps.check.outputs.critical_count }}' || 'NaN', 10);
            if (!ran) { console.log('本次未执行外部扫描，跳过'); return; }
            if (isNaN(crit) || crit > 0) { console.log('存在 critical 问题，外部告警保持开启'); return; }
            const title = '🛡️ AIShield 扫描发现严重安全问题';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const ex = issues.find(i => i.title === title && !i.pull_request);
            if (!ex) { console.log('无开启中的外部扫描安全告警'); return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ex.number,
              body: `✅ 本轮外部扫描未发现 critical 级问题（run ${context.runId} @ ${context.sha.slice(0,7)}），自动关闭本告警。`
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ex.number, state: 'closed', state_reason: 'completed'
            });
            console.log(`已自动关闭外部扫描安全告警 issue #${ex.number}`);

      - name: Upload External Scan Report
        if: always() && hashFiles('external-scan-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-scan-report
          path: external-scan-report.json
          retention-days: 30

      - name: Comment on PR (if triggered by pull_request)
        if: github.event_name == 'pull_request' && hashFiles('external-scan-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('external-scan-report.json', 'utf8'));
            const score = report.overall_score || 0;
            const badge = report.badge_level || 'none';
            const findings = report.total_findings || 0;
            const critical = (report.findings || []).filter(f => f.severity === 'critical').length;
            const body = `## 🛡️ AIShield Security Scan\n**Score: ${score}/100** | Badge: ${badge} | Issues: ${findings} | Critical: ${critical}\n\n${critical > 0 ? '⚠️ Critical issues detected!' : '✅ No critical issues.'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body
            });

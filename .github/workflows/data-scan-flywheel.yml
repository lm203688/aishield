name: AIShield Data Flywheel (Batch Scan to Self-Built Database)

# 自动化/数据飞轮：批量采集MCP工具 -> 安全扫描 -> 入库 self-built DB -> 生成报告
# 生态化/盈利化： 数据即信任，信任即用户，扫描库越大越有权威性与吸引力
# 原则：Research-Informed（对齐 OWASP Top10 与最新工具）

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      source:
        description: '数据源 (smithery/glama/pulsemcp/github/all)'
        default: 'all'
      limit:
        description: '每源扫描数量'
        default: '30'
      incremental:
        description: '增量扫描(跳过近7天)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-scan
  cancel-in-progress: false

env:
  BATCH_DB: data/batch_scans.json
  MONITORED: data/monitored_tools.json

jobs:
  scan:
    name: Crawl & Scan & Store
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      before: ${{ steps.before.outputs.count }}
      after: ${{ steps.verify.outputs.count }}
      grew: ${{ steps.verify.outputs.grew }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Record DB size before scan
        id: before
        run: |
          N=$(python -c "import json,os;p='${BATCH_DB}';d=json.load(open(p)) if os.path.exists(p) else [];print(len(d) if isinstance(d,list) else len(d.get('scans',[])))" 2>/dev/null || echo 0)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "扫描前库存: $N 条"

      - name: Run batch scan (数据飞轮增量入库)
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || '' }}
        run: |
          python -c "from scanner.batch_scanner import *" 2>/dev/null || true
          python -m py_compile scanner/batch_scanner.py scanner/engine.py scanner/rules.py
          python -m scanner.batch_scanner --source "${{ inputs.source || 'all' }}" \
            --limit ${{ inputs.limit || 30 }} --workers 3 --incremental --skip-days 7 \
            2>&1 | tail -60
          echo "SCAN_EXIT=$?"

      - name: Regenerate scan report
        run: |
          python -m scanner.batch_scanner --report 2>&1 | tail -20

      # 验证：飞轮的价值在于"越转越大"，停止增长即等于失效
      - name: Verify flywheel actually grew
        id: verify
        run: |
          N=$(python -c "import json,os;p='${BATCH_DB}';d=json.load(open(p)) if os.path.exists(p) else [];print(len(d) if isinstance(d,list) else len(d.get('scans',[])))" 2>/dev/null || echo 0)
          BEFORE="${{ steps.before.outputs.count }}"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" -gt "$BEFORE" ]; then
            echo "grew=true" >> "$GITHUB_OUTPUT"
            echo "飞轮增长: $BEFORE -> $N (+$((N-BEFORE)))"
          else
            echo "grew=false" >> "$GITHUB_OUTPUT"
            echo "::warning::飞轮未增长（$BEFORE -> $N），数据源可能已失效"
          fi
          GREW=$([ "$N" -gt "$BEFORE" ] && echo true || echo false)
          python scripts/state_bus.py set flywheel \
            "{\"total\":$N,\"before\":$BEFORE,\"grew\":$GREW}" \
            --source data-scan-flywheel || true

      - name: Commit database update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[full]"
          git config user.email "github-actions[full]@users.noreply.github.com"
          git add data/batch_scans.json data/monitored_tools.json data/security_report.md 2>/dev/null
          git add data/batch_scans.json data/monitored_tools.json data/security_report.md data/state/flywheel.json  2>/dev/null
          if ! git diff --cached --quiet; then
            git commit -m "auto: 批量扫描入库 [skip ci]"
            bash scripts/git_push_safe.sh
            echo "DB updated & committed"
          else
            echo "No new scan data this cycle"
          fi

  # 告警：飞轮停转是渐进式失效，不主动喊就会悄无声息地死掉
  alert:
    name: Alert on Flywheel Stall
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Escalate scan failure
        if: needs.scan.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          {
            printf '%s\n' "数据飞轮批量扫描执行失败，自建库本周期未入库。"
            printf '%s\n' "运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/flywheel_fail.md
          python scripts/notify.py --level P1 \
            --title "数据飞轮扫描失败" \
            --fingerprint "flywheel-scan-fail" \
            --body "$(cat /tmp/flywheel_fail.md)"

      - name: Warn on zero growth
        if: needs.scan.result == 'success' && needs.scan.outputs.grew == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          {
            printf '%s\n' "数据飞轮本周期零增长：库存仍为 ${{ needs.scan.outputs.after }} 条。"
            printf '%s\n' ""
            printf '%s\n' "可能原因：上游数据源接口变更 / 增量去重过于激进 / 采集配额耗尽。"
            printf '%s\n' "飞轮的护城河来自数据量，停止增长等同于失去竞争力。"
          } > /tmp/flywheel_stall.md
          python scripts/notify.py --level P2 \
            --title "数据飞轮零增长" \
            --fingerprint "flywheel-no-growth" \
            --cooldown 72 \
            --body "$(cat /tmp/flywheel_stall.md)"

      - name: Clear alarms on healthy growth
        if: needs.scan.result == 'success' && needs.scan.outputs.grew == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          python scripts/notify.py --resolve --fingerprint "flywheel-scan-fail" \
            --title "数据飞轮恢复" --body "扫描已恢复正常。" || true
          python scripts/notify.py --resolve --fingerprint "flywheel-no-growth" \
            --title "数据飞轮恢复增长" \
            --body "库存 ${{ needs.scan.outputs.before }} -> ${{ needs.scan.outputs.after }}。" || true
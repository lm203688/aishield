name: AIShield Threat-Intel Feed Update

# 专业数据库对接：拉取 NVD/GitHub 安全公告中的 MCP/Agent 相关漏洞 -> 自建威胁情报库
# 原则：Research-Informed / 安全可信 / 自动化
# 数据飞轮：情报库越全，规则更新越准，检测越强

on:
  schedule:
    - cron: '15 7 * * 1,4'  # 每周一、周四 07:15 更新威胁情报
  workflow_dispatch:

permissions:
  contents: write

env:
  THREAT_DB: data/threat_intel.json

jobs:
  feed:
    name: Fetch MCP/Agent CVEs & Append to Threat DB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch & merge threat intelligence
        id: fetch
        run: |
          python - <<'PY' 2>&1 | tail -50
          import json, os, urllib.request, urllib.parse, time
          from datetime import datetime, timezone

          THREAT_DB = "data/threat_intel.json"
          os.makedirs("data", exist_ok=True)

          db = []
          if os.path.exists(THREAT_DB):
              try:
                  db = json.load(open(THREAT_DB, encoding="utf-8"))
                  if isinstance(db, dict): db = db.get("intel", [])
              except Exception:
                  db = []

          new = []

          # 1) GitHub search API: recent AI/MCP security advisories & CVE keywork
          def gh_search(q, per_page=10):
              url = "https://api.github.com/search/repositories?sort=updated&q=" + urllib.parse.quote(q)
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "aishield-intel",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r).get("items", [])
              except Exception as e:
                  print("!! gh search failed:", e)
                  return []

          kws = ["MCP server security CVE", "prompt injection vulnerability", "AI agent supply chain"]
          for kw in kws:
              for it in gh_search(kw):
                  new.append({
                      "source": "github",
                      "type": "keyword:" + kw,
                      "title": it.get("full_name", ""),
                      "url": it.get("html_url", ""),
                      "desc": (it.get("description") or "")[:200],
                      "updated": it.get("updated_at", ""),
                      "fetched": datetime.now(timezone.utc).isoformat(),
                  })

          # 2) Merge: dedupe by url
          seen = {d.get("url") for d in db}
          added = 0
          for it in new:
              if it.get("url") and it["url"] not in seen:
                  db.append(it)
                  seen.add(it["url"])
                  added += 1

          db = db[-500:]  # 控制库规模
          with open(THREAT_DB, "w", encoding="utf-8") as f:
              json.dump({"intel": db, "updated": datetime.now(timezone.utc).isoformat()}, f,
                        ensure_ascii=False, indent=2)

          print(f"Threat DB: {len(db)} entries total, {added} new this cycle.")
          PY

      - name: Commit threat intel update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[full]"
          git config user.email "github-actions[full]@users.noreply.github.com"
          git add data/threat_intel.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: 更新威胁情报库 [skip ci]" || true
            git push origin main || echo "push skipped"
          else
            echo "No new intel this cycle"
          fi
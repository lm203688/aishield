name: AIShield Meta-Monitor (监控自动化体系本身)

# 补位任务 N1：谁来监控监控者
# 背景：self-heal-closed-loop.yml 因 YAML 语法错误静默失效 48 天无人发现
# 本工作流每 6 小时体检一次自动化体系自身：语法/活性/状态新鲜度/台账真实性/闭环完整性/告警可达性

on:
  schedule:
    - cron: '0 * * * *'   # 加速期每小时（2026-08-31 回滚至 '15 */6 * * *'）
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: meta-monitor
  cancel-in-progress: false

jobs:
  inspect:
    name: Six-Dimension Health Check
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.check.outputs.score }}
      level: ${{ steps.check.outputs.level }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install YAML parser
        run: pip install pyyaml

      # 门禁 1：语法必须先过，语法错的工作流永远不会运行
      - name: Gate - workflow syntax must be valid
        run: python scripts/validate_workflows.py

      - name: Run meta monitor
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          set +e
          python scripts/meta_monitor.py --notify | tee /tmp/meta.log
          RC=$?
          set -e
          SCORE=$(python -c "import json;d=json.load(open('data/state/meta.json'));print(d['current'].get('score',0))" 2>/dev/null || echo 0)
          LEVEL=$(python -c "import json;d=json.load(open('data/state/meta.json'));print(d['current'].get('level','unknown'))" 2>/dev/null || echo unknown)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "体系健康分: $SCORE / 等级: $LEVEL (rc=$RC)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## AIShield 自动化体系体检"
            echo ""
            echo "- 健康分：**${{ steps.check.outputs.score }}**"
            echo "- 等级：**${{ steps.check.outputs.level }}**"
            echo ""
            echo '```'
            cat /tmp/meta.log 2>/dev/null || echo "no log"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit meta state
        if: always()
        run: |
          git config user.name  "aishield-bot"
          git config user.email "bot@aishield.local"
          git add data/state/meta.json || true
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore(meta): 体系体检 score=${{ steps.check.outputs.score }} level=${{ steps.check.outputs.level }}"
            git pull --rebase --autostash || true
            git push || echo "push 失败，状态已本地记录"
          fi

  heartbeat:
    name: Heartbeat - Alert Channel Reachability
    runs-on: ubuntu-latest
    needs: inspect
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 反向验证：如果 inspect 整个 job 挂了，说明监控者自己死了，必须能喊出来
      - name: Escalate if inspector itself failed
        if: needs.inspect.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          {
            printf '%s\n' "meta-monitor 的 inspect job 执行失败，自动化体系当前处于无人值守状态。"
            printf '%s\n' ""
            printf '%s\n' "这是最高优先级告警：连体检都跑不了，其余闭环的状态不可信。"
            printf '%s\n' "运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/meta_down.md
          python scripts/notify.py --level P0 \
            --title "元监控自身执行失败（监控者已死）" \
            --fingerprint "meta-monitor-down" \
            --cooldown 3 \
            --body "$(cat /tmp/meta_down.md)"

      - name: Clear alarm on recovery
        if: needs.inspect.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          python scripts/notify.py --resolve \
            --fingerprint "meta-monitor-down" \
            --title "元监控恢复" \
            --body "inspect job 已恢复正常执行。"

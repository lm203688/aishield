name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/20 * * * *'  # 加速期每20分钟（2026-08-31 回滚至 '52 4 * * 1'）
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  aishield-self-scan:
    name: Self-Scan with AIShield
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start AIShield Server
        run: |
          python api/server.py &
          sleep 3
          curl -s http://localhost:8450/api/v1/health

      - name: Scan Repository
        run: |
          curl -s -X POST http://localhost:8450/api/v1/audit \
            -H "Content-Type: application/json" \
            -d '{
              "tool_name": "aishield-repo",
              "tool_description": "AIShield self-scan of repository",
              "tool_schema": {},
              "source_url": "https://github.com/lm203688/aishield",
              "capabilities": ["scan"]
            }' | tee scan-report.json

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: scan-report.json

      - name: Check Risk Level
        run: |
          SCORE=$(cat scan-report.json | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('report') or {}; print(r.get('overall_score', d.get('score',0)))")
          echo "Security Score: $SCORE"
          if [ "$SCORE" -lt 60 ]; then
            echo "::error::Security score $SCORE is below threshold (60)"
            exit 1
          fi

      - name: Alert on low security score (open tracked issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let score = 0;
            try { const d = JSON.parse(fs.readFileSync('scan-report.json','utf8')); score = (d.report && d.report.overall_score != null) ? d.report.overall_score : (d.score ?? 0); } catch(e) { console.log('no report'); }
            if (score >= 60) { console.log('安全得分正常:', score); return; }
            const title = `🔒 安全门禁未通过：得分 ${score}/100 (run ${context.runId})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (issues.find(i => i.title === title && !i.pull_request)) { console.log('已有告警'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `AIShield 自扫描安全得分 ${score}/100 低于阈值 60，需排查。\n\n运行链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','alert','automated']
            });
            console.log('已创建安全门禁告警 issue');
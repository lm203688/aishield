name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /opt/aishield || cd ~/aishield
          git pull origin main
          python3 -m py_compile api/server.py eco/*.py scanner/*.py

          # ── 重启 API 服务 ──
          pkill -f "api/server.py" || true
          sleep 2
          export PORT=8450
          export CREEM_API_KEY=${{ secrets.CREEM_API_KEY }}
          export CREEM_WEBHOOK_SECRET=${{ secrets.CREEM_WEBHOOK_SECRET || 'whsec_28uK7ZQhVAhdcgvdhYF4Ac' }}
          export CREEM_TEST_MODE=${{ secrets.CREEM_TEST_MODE || 'true' }}
          nohup python3 api/server.py > server.log 2>&1 &
          sleep 3

          # ── 配置 Nginx 反向代理 (80 → 8450) ──
          # Cloudflare SSL: Flexible 模式 → Cloudflare HTTP 80 → Nginx → API 8450
          if command -v nginx &> /dev/null; then
            echo "Nginx installed, configuring..."
            bash setup-nginx.sh || echo "WARNING: Nginx setup had issues"
          else
            echo "Installing Nginx..."
            sudo apt-get update -qq && sudo apt-get install -y -qq nginx
            bash setup-nginx.sh || echo "WARNING: Nginx setup had issues"
          fi
          sleep 2

          # ── 验证 ──
          echo "── API 健康检查 ──"
          curl -sf http://localhost:8450/api/v1/health && echo " → API OK" || echo "API FAIL"

          echo "── Nginx 代理检查 ──"
          curl -sf http://localhost/api/v1/health && echo " → Nginx OK" || echo "Nginx FAIL"

          echo "── Cloudflare 全链路检查 ──"
          curl -sf https://aishield.tools/api/v1/health && echo " → Full Chain OK" || echo "Cloudflare FAIL (check SSL mode = Flexible)"

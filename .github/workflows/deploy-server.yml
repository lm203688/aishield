name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 15m
        script: |
          set +e
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null
          git pull origin main 2>/dev/null

          echo "=== STEP 1: 启动 API (端口 8450) ==="
          docker start $(docker ps -aq --filter "status=exited") 2>/dev/null
          sleep 3
          if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
            echo "API 未运行，尝试启动..."
            if [ -f docker-compose.yml ]; then
              docker compose up -d 2>/dev/null || docker-compose up -d 2>/dev/null || true
              sleep 5
            fi
            if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
              pkill -f "api/server.py" 2>/dev/null || true
              sleep 1
              export PORT=8450
              nohup python3 api/server.py > /tmp/aishield-api.log 2>&1 &
              sleep 5
            fi
          fi
          echo "API 状态:"
          curl -sf http://127.0.0.1:8450/api/v1/health && echo " OK" || echo " FAIL"

          echo ""
          echo "=== STEP 2: 停止所有 Nginx 进程 ==="
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          pkill -f "nginx: master" 2>/dev/null || true
          pkill -f "nginx: worker" 2>/dev/null || true
          sleep 2
          echo "443端口占用检查:"
          ss -tlnp | grep ':443 ' || echo "  443端口已释放"

          echo ""
          echo "=== STEP 3: 生成自签 SSL 证书 ==="
          mkdir -p /etc/nginx/ssl
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout /etc/nginx/ssl/key.pem \
            -out /etc/nginx/ssl/cert.pem \
            -subj "/CN=aishield.tools" 2>/dev/null
          echo "证书状态:"
          ls -la /etc/nginx/ssl/cert.pem /etc/nginx/ssl/key.pem 2>/dev/null

          echo ""
          echo "=== STEP 4: 安装 Nginx 并复制配置文件 ==="
          which nginx 2>/dev/null || { apt-get update -qq; apt-get install -y -qq nginx; }

          # 直接从仓库复制 nginx.conf（避免 heredoc 缩进问题）
          cp nginx/nginx.conf /etc/nginx/nginx.conf
          echo "Nginx 配置已复制"

          # 创建 mime.types（如果不存在）
          if [ ! -f /etc/nginx/mime.types ]; then
            echo "Creating minimal mime.types..."
            echo "types {}" > /etc/nginx/mime.types
          fi

          echo "Nginx 配置测试:"
          nginx -t 2>&1

          echo ""
          echo "=== STEP 5: 启动 Nginx ==="
          systemctl restart nginx 2>/dev/null || service nginx restart 2>/dev/null || nginx 2>&1
          systemctl enable nginx 2>/dev/null || true
          sleep 3

          echo ""
          echo "=== STEP 5.5: 检查并开放防火墙端口 ==="
          echo "--- iptables 规则 ---"
          iptables -L INPUT -n --line-numbers 2>/dev/null | head -20
          echo ""
          echo "--- 添加防火墙规则 ---"
          iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null && echo "443端口已开放(iptables)" || echo "iptables 443 失败"
          iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null && echo "80端口已开放(iptables)" || echo "iptables 80 失败"
          iptables -I INPUT -p tcp --dport 8450 -j ACCEPT 2>/dev/null && echo "8450端口已开放(iptables)" || echo "iptables 8450 失败"
          iptables-save > /etc/iptables.rules 2>/dev/null || true
          netfilter-persistent save 2>/dev/null || true
          if command -v ufw &> /dev/null; then
            ufw allow 443/tcp 2>/dev/null && echo "443端口已开放(ufw)" || true
            ufw allow 80/tcp 2>/dev/null && echo "80端口已开放(ufw)" || true
          fi

          echo ""
          echo "=== STEP 6: 验证 ==="
          echo "--- 端口监听 ---"
          ss -tlnp | grep -E ':(80|443|8450) '
          echo ""
          echo "--- API (8450) ---"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTPS 本地 (443) ---"
          curl -sk https://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTPS 外部IP (443) ---"
          curl -sk https://150.158.119.19/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL (可能安全组阻止)"
          echo ""
          echo "--- Nginx 进程 ---"
          ps aux | grep nginx | grep -v grep
          echo ""
          echo "--- Nginx 错误日志 ---"
          tail -5 /var/log/nginx/error.log 2>/dev/null || echo "无错误日志"
          echo ""
          echo "--- iptables 443规则 ---"
          iptables -L INPUT -n 2>/dev/null | grep 443 || echo "无443规则"
          echo ""
          echo "=== 诊断结论 ==="
          if curl -sk https://127.0.0.1/api/v1/health 2>/dev/null; then
            echo "本地443端口: OK"
            if curl -sk https://150.158.119.19/api/v1/health 2>/dev/null; then
              echo "外部443端口: OK - 服务应已恢复"
            else
              echo "外部443端口: FAIL - 需在腾讯云安全组添加443端口入站规则"
            fi
          else
            echo "本地443端口: FAIL - Nginx未正确监听443"
          fi

          exit 0

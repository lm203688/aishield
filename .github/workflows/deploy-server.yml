name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 15m
        script: |
          set +e
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null
          git pull origin main 2>/dev/null

          echo "=== STEP 1: 启动 API (端口 8450) ==="
          docker start $(docker ps -aq --filter "status=exited") 2>/dev/null
          sleep 3
          if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
            echo "API 未运行，尝试启动..."
            if [ -f docker-compose.yml ]; then
              docker compose up -d 2>/dev/null || docker-compose up -d 2>/dev/null || true
              sleep 5
            fi
            if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
              pkill -f "api/server.py" 2>/dev/null || true
              sleep 1
              export PORT=8450
              nohup python3 api/server.py > /tmp/aishield-api.log 2>&1 &
              sleep 5
            fi
          fi
          echo "API 状态:"
          curl -sf http://127.0.0.1:8450/api/v1/health && echo " OK" || echo " FAIL"

          echo ""
          echo "=== STEP 2: 停止所有 Nginx 进程 ==="
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          pkill -f "nginx: master" 2>/dev/null || true
          pkill -f "nginx: worker" 2>/dev/null || true
          sleep 2
          echo "443端口占用检查:"
          ss -tlnp | grep ':443 ' || echo "  443端口已释放"

          echo ""
          echo "=== STEP 3: 生成自签 SSL 证书 ==="
          mkdir -p /etc/nginx/ssl
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout /etc/nginx/ssl/key.pem \
            -out /etc/nginx/ssl/cert.pem \
            -subj "/CN=aishield.tools" 2>/dev/null
          echo "证书状态:"
          ls -la /etc/nginx/ssl/cert.pem /etc/nginx/ssl/key.pem 2>/dev/null

          echo ""
          echo "=== STEP 4: 安装并配置 Host Nginx ==="
          which nginx 2>/dev/null || { apt-get update -qq; apt-get install -y -qq nginx; }

          # 写入 Nginx 配置（无前导空格）
          cat > /etc/nginx/nginx.conf << 'EOF'
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name aishield.tools www.aishield.tools _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        location / {
            proxy_pass http://127.0.0.1:8450;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name aishield.tools www.aishield.tools _;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
EOF

          echo "Nginx 配置测试:"
          nginx -t 2>&1

          echo ""
          echo "=== STEP 5: 启动 Nginx ==="
          systemctl restart nginx 2>/dev/null || service nginx restart 2>/dev/null || nginx 2>&1
          systemctl enable nginx 2>/dev/null || true
          sleep 3

          echo ""
          echo "=== STEP 6: 验证 ==="
          echo "--- 端口监听 ---"
          ss -tlnp | grep -E ':(80|443|8450) '
          echo ""
          echo "--- API (8450) ---"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTPS (443) ---"
          curl -sk https://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTP (80) ---"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL (预期)"
          echo ""
          echo "--- Nginx 进程 ---"
          ps aux | grep nginx | grep -v grep
          echo ""
          echo "--- Nginx 错误日志 ---"
          tail -5 /var/log/nginx/error.log 2>/dev/null || echo "无错误日志"

          exit 0

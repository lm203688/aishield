name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 15m
        script: |
          set +e
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null
          git pull origin main 2>/dev/null
          PROJ=$(pwd)
          echo "DIR=$PROJ"

          # 1. 检查 API
          echo "=== API ==="
          curl -sf http://127.0.0.1:8450/api/v1/health && echo "OK" || echo "FAIL"

          # 2. 安装 Nginx (如果没有)
          echo "=== Nginx install ==="
          which nginx || apt-get update -qq && apt-get install -y -qq nginx
          nginx -v 2>&1

          # 3. 防火墙
          echo "=== Firewall ==="
          ufw allow 80/tcp 2>/dev/null || true
          ufw allow 443/tcp 2>/dev/null || true
          iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || true

          # 4. 停止 Docker 占用 80
          echo "=== Stop Docker on 80 ==="
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          docker ps -q 2>/dev/null | while read c; do docker port "$c" 2>/dev/null | grep -q '80/tcp' && docker stop "$c" 2>/dev/null; done
          systemctl stop nginx 2>/dev/null
          pkill nginx 2>/dev/null
          sleep 2

          # 5. 写 Nginx 配置 (直接写到 nginx.conf)
          echo "=== Write config ==="
          cat > /etc/nginx/nginx.conf << 'EOF'
worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;
        location / {
            proxy_pass http://127.0.0.1:8450;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
EOF

          # 6. 测试并启动
          echo "=== Test config ==="
          nginx -t 2>&1
          echo "=== Start nginx ==="
          nginx 2>&1 || systemctl start nginx 2>&1 || service nginx start 2>&1
          sleep 2

          # 7. 诊断
          echo "=== Diagnostics ==="
          echo "--- ss port 80 ---"
          ss -tlnp | grep ':80 '
          echo "--- ss port 8450 ---"
          ss -tlnp | grep ':8450 '
          echo "--- nginx process ---"
          ps aux | grep nginx | grep -v grep
          echo "--- nginx error log ---"
          tail -5 /var/log/nginx/error.log 2>/dev/null
          echo "--- curl localhost:80 ---"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- curl localhost:8450 ---"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"

          exit 0

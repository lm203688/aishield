name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set +e
          export HOME=/root

          # 找到项目目录
          PROJ_DIR=""
          for d in /opt/aishield /root/aishield /home/*/aishield; do
            if [ -d "$d" ]; then PROJ_DIR="$d"; break; fi
          done
          if [ -z "$PROJ_DIR" ]; then
            echo "ERROR: project directory not found"
            exit 1
          fi
          echo "Project dir: $PROJ_DIR"
          cd "$PROJ_DIR"
          git pull origin main 2>/dev/null

          echo "=== 1. API 状态 ==="
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " → OK" || {
            echo "API not running, starting..."
            pkill -f "api/server.py" 2>/dev/null; sleep 1
            cd "$PROJ_DIR"
            PORT=8450 nohup python3 api/server.py > /tmp/api.log 2>&1 &
            sleep 3
            curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " → OK" || echo " → FAIL"
          }

          echo ""
          echo "=== 2. 停止端口 80 占用 ==="
          systemctl stop nginx 2>/dev/null
          pkill -f "nginx: master" 2>/dev/null
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          # 停止所有映射 80 端口的容器
          docker ps -q 2>/dev/null | while read cid; do
            docker port "$cid" 2>/dev/null | grep -q '80/tcp' && docker stop "$cid" 2>/dev/null
          done
          sleep 2

          echo ""
          echo "=== 3. 启动 Nginx ==="
          mkdir -p "$PROJ_DIR/html"
          docker run -d \
            --name aishield-nginx \
            --network host \
            --restart unless-stopped \
            -v "$PROJ_DIR/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PROJ_DIR/html:/var/www/html:ro" \
            nginx:alpine 2>&1
          sleep 3

          echo ""
          echo "=== 4. 诊断 ==="
          echo "--- Docker containers ---"
          docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" 2>/dev/null
          echo "--- Port 80 ---"
          ss -tlnp 2>/dev/null | grep ':80 '
          echo "--- Port 8450 ---"
          ss -tlnp 2>/dev/null | grep ':8450 '
          echo "--- Nginx logs ---"
          docker logs aishield-nginx 2>&1 | tail -10
          echo "--- curl localhost:80 ---"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " → OK" || echo " → FAIL"
          echo "--- curl localhost:8450 ---"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " → OK" || echo " → FAIL"

          exit 0

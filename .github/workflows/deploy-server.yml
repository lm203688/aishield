name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 15m
        script: |
          set +e
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null
          git pull origin main 2>/dev/null

          echo "=== STEP 1: 恢复所有停止的 Docker 容器 ==="
          docker ps -a --format "{{.ID}} {{.Names}} {{.Image}} {{.Status}}" 2>/dev/null
          echo "---"
          # 启动所有停止的容器
          docker start $(docker ps -aq --filter "status=exited") 2>/dev/null
          sleep 5

          echo ""
          echo "=== STEP 2: 检查端口 ==="
          ss -tlnp | grep -E ':(80|443|8450) ' 2>/dev/null
          echo "---"
          echo "API 8450:"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "Port 80:"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"

          echo ""
          echo "=== STEP 3: 如果端口 80 仍不通，尝试启动 Nginx ==="
          if ! curl -sf http://127.0.0.1/api/v1/health 2>/dev/null; then
            echo "端口 80 不通，尝试修复..."

            # 方法1: 启动 Nginx Docker 容器 (host 网络)
            echo "尝试 Docker Nginx..."
            docker stop aishield-nginx 2>/dev/null
            docker rm aishield-nginx 2>/dev/null
            docker run -d --name aishield-nginx --network host --restart unless-stopped \
              -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              nginx:alpine 2>&1
            sleep 3
            echo "Docker Nginx status:"
            docker ps --filter name=aishield-nginx --format "{{.Status}}" 2>/dev/null
            echo "Docker Nginx logs:"
            docker logs aishield-nginx 2>&1 | tail -5

            # 检查是否成功
            if curl -sf http://127.0.0.1/api/v1/health 2>/dev/null; then
              echo "Docker Nginx 成功!"
            else
              echo "Docker Nginx 失败，尝试 host nginx..."

              # 方法2: 安装并启动 host Nginx
              which nginx 2>/dev/null || { apt-get update -qq; apt-get install -y -qq nginx; }
              cat > /etc/nginx/nginx.conf << 'NGINXEOF'
worker_processes auto;
events { worker_connections 1024; }
http {
    default_type application/octet-stream;
    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;
        location / {
            proxy_pass http://127.0.0.1:8450;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
NGINXEOF
              nginx -t 2>&1
              pkill nginx 2>/dev/null; sleep 1
              nginx 2>&1 || systemctl start nginx 2>&1
              sleep 2
              echo "Host Nginx status:"
              ps aux | grep nginx | grep -v grep
              curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo "Host Nginx OK!" || echo "Host Nginx FAIL"
            fi
          fi

          echo ""
          echo "=== 最终状态 ==="
          echo "Docker containers:"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}" 2>/dev/null
          echo ""
          echo "Ports:"
          ss -tlnp | grep -E ':(80|8450) ' 2>/dev/null
          echo ""
          echo "API (8450):"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "Nginx (80):"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"

          exit 0

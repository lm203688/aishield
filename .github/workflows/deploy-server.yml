name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 15m
        script: |
          set +e
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null
          git pull origin main 2>/dev/null

          echo "=== STEP 1: 启动 API (端口 8450) ==="
          # 恢复停止的 Docker 容器
          docker start $(docker ps -aq --filter "status=exited") 2>/dev/null
          sleep 3

          # 检查 API 是否运行
          if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
            echo "API 未运行，尝试启动..."
            # 方法1: Docker Compose
            if [ -f docker-compose.yml ]; then
              docker compose up -d 2>/dev/null || docker-compose up -d 2>/dev/null || true
              sleep 5
            fi
            # 方法2: 直接运行
            if ! curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null; then
              pkill -f "api/server.py" 2>/dev/null || true
              sleep 1
              export PORT=8450
              nohup python3 api/server.py > /tmp/aishield-api.log 2>&1 &
              sleep 5
            fi
          fi

          echo "API 状态:"
          curl -sf http://127.0.0.1:8450/api/v1/health && echo " OK" || echo " FAIL"

          echo ""
          echo "=== STEP 2: 生成自签 SSL 证书 ==="
          mkdir -p /etc/nginx/ssl
          if [ ! -f /etc/nginx/ssl/cert.pem ]; then
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout /etc/nginx/ssl/key.pem \
              -out /etc/nginx/ssl/cert.pem \
              -subj "/CN=aishield.tools" 2>/dev/null
            echo "自签证书已生成"
          else
            echo "证书已存在，跳过"
          fi

          echo ""
          echo "=== STEP 3: 释放被占用的 80/443 端口 ==="
          # 检查并停止占用端口的 Docker 容器
          for port in 80 443; do
            CONTAINER=$(docker ps --format '{{.Names}}' 2>/dev/null | while read name; do
              if docker port "$name" 2>/dev/null | grep -q "${port}/tcp"; then
                echo "$name"
                break
              fi
            done)
            if [ -n "$CONTAINER" ]; then
              echo "停止占用 ${port} 端口的容器: $CONTAINER"
              docker stop "$CONTAINER" 2>/dev/null || true
            fi
          done
          sleep 2

          echo ""
          echo "=== STEP 4: 配置并启动 Nginx (443 + 80) ==="

          # 方法1: Docker Nginx (host 网络)
          echo "尝试 Docker Nginx..."
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          docker run -d --name aishield-nginx --network host --restart unless-stopped \
            -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /etc/nginx/ssl:/etc/nginx/ssl:ro \
            nginx:alpine 2>&1
          sleep 3

          # 检查 Docker Nginx 是否启动成功
          NGINX_OK=false
          if docker ps --filter name=aishield-nginx --format "{{.Status}}" 2>/dev/null | grep -q "Up"; then
            if curl -sk https://127.0.0.1/api/v1/health 2>/dev/null; then
              echo "Docker Nginx (443) 成功!"
              NGINX_OK=true
            fi
          fi

          # 方法2: Host Nginx (如果 Docker 失败)
          if [ "$NGINX_OK" = false ]; then
            echo "Docker Nginx 失败，尝试 Host Nginx..."

            # 安装 Nginx
            which nginx 2>/dev/null || { apt-get update -qq; apt-get install -y -qq nginx; }

            # 写入配置
            cat > /etc/nginx/nginx.conf << 'NGINXCONF'
          worker_processes auto;
          events { worker_connections 1024; }
          http {
              include       mime.types;
              default_type  application/octet-stream;
              sendfile      on;
              keepalive_timeout 65;
              client_max_body_size 50m;

              map $http_upgrade $connection_upgrade {
                  default upgrade;
                  ''      close;
              }

              server {
                  listen 443 ssl;
                  listen [::]:443 ssl;
                  server_name aishield.tools www.aishield.tools healthlens.cc www.healthlens.cc _;

                  ssl_certificate     /etc/nginx/ssl/cert.pem;
                  ssl_certificate_key /etc/nginx/ssl/key.pem;
                  ssl_protocols       TLSv1.2 TLSv1.3;
                  ssl_ciphers         HIGH:!aNULL:!MD5;

                  proxy_connect_timeout 5s;
                  proxy_send_timeout    60s;
                  proxy_read_timeout    60s;

                  location / {
                      proxy_pass http://127.0.0.1:8450;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection $connection_upgrade;
                      proxy_buffering off;
                      proxy_request_buffering off;
                  }
              }

              server {
                  listen 80;
                  listen [::]:80;
                  server_name aishield.tools www.aishield.tools healthlens.cc www.healthlens.cc _;

                  location /.well-known/acme-challenge/ {
                      root /var/www/html;
                  }

                  location / {
                      return 301 https://$host$request_uri;
                  }
              }
          }
          NGINXCONF

            # 确保 SSL 目录和证书存在
            mkdir -p /etc/nginx/ssl
            if [ ! -f /etc/nginx/ssl/cert.pem ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/key.pem \
                -out /etc/nginx/ssl/cert.pem \
                -subj "/CN=aishield.tools" 2>/dev/null
            fi

            # 测试并重启
            nginx -t 2>&1
            pkill nginx 2>/dev/null || true
            sleep 1
            systemctl restart nginx 2>/dev/null || service nginx restart 2>/dev/null || nginx 2>&1
            systemctl enable nginx 2>/dev/null || true
            sleep 2

            if curl -sk https://127.0.0.1/api/v1/health 2>/dev/null; then
              echo "Host Nginx (443) 成功!"
              NGINX_OK=true
            fi
          fi

          echo ""
          echo "=== 最终状态 ==="
          echo "--- Docker 容器 ---"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}" 2>/dev/null
          echo ""
          echo "--- 端口监听 ---"
          ss -tlnp | grep -E ':(80|443|8450) ' 2>/dev/null
          echo ""
          echo "--- API (8450) ---"
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTPS (443) ---"
          curl -sk https://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL"
          echo "--- Nginx HTTP (80) ---"
          curl -sf http://127.0.0.1/api/v1/health 2>/dev/null && echo " OK" || echo " FAIL (备案拦截预期)"

          exit 0

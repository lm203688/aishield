name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set +e
          cd /opt/aishield || cd ~/aishield
          git pull origin main

          echo "=== 1. 检查 API (8450) ==="
          curl -sf http://127.0.0.1:8450/api/v1/health && echo " → API OK" || {
            echo "API 未运行，启动..."
            pkill -f "api/server.py" 2>/dev/null
            sleep 1
            export PORT=8450
            export CREEM_API_KEY=${{ secrets.CREEM_API_KEY }}
            export CREEM_WEBHOOK_SECRET=${{ secrets.CREEM_WEBHOOK_SECRET }}
            export CREEM_TEST_MODE=${{ secrets.CREEM_TEST_MODE }}
            nohup python3 api/server.py > server.log 2>&1 &
            sleep 3
            curl -sf http://127.0.0.1:8450/api/v1/health && echo " → API OK" || echo " → API FAIL"
          }

          echo ""
          echo "=== 2. 停止占用端口 80 的进程 ==="
          # 停止 host nginx
          systemctl stop nginx 2>/dev/null
          pkill -f "nginx: master" 2>/dev/null
          # 停止旧的 Docker nginx 容器
          docker stop aishield-nginx 2>/dev/null
          docker rm aishield-nginx 2>/dev/null
          # 停止所有占用端口 80 的 Docker 容器
          for c in $(docker ps -q 2>/dev/null); do
            if docker port "$c" 2>/dev/null | grep -q '80/tcp'; then
              echo "停止容器: $(docker inspect --format '{{.Name}}' $c)"
              docker stop "$c" 2>/dev/null
            fi
          done
          sleep 2

          echo ""
          echo "=== 3. 启动 Nginx 容器 (host 网络) ==="
          mkdir -p html
          docker run -d \
            --name aishield-nginx \
            --network host \
            --restart unless-stopped \
            -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $(pwd)/html:/var/www/html:ro \
            nginx:alpine
          sleep 3

          echo ""
          echo "=== 4. 验证 ==="
          echo "── Docker 容器 ──"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}" 2>/dev/null

          echo ""
          echo "── 端口监听 ──"
          ss -tlnp | grep -E ':(80|8450) '

          echo ""
          echo "── API (8450) ──"
          curl -sf http://127.0.0.1:8450/api/v1/health && echo " ✅" || echo " ❌"

          echo ""
          echo "── Nginx (80) ──"
          curl -sf http://127.0.0.1/api/v1/health && echo " ✅" || echo " ❌"

          echo ""
          echo "── Cloudflare ──"
          curl -sf https://aishield.tools/api/v1/health && echo " ✅" || echo " ❌ (check SSL=Flexible)"

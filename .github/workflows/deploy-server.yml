name: Deploy to Production Server

on:
  push:
    branches: [ main ]
    # self-heal-closed-loop 每次探测都会把 data/state/health.json 提交回 main，
    # 状态回写不是代码变更，不该触发一次 20 分钟的 SSH 部署。
    # diagnostics/ 与 automation/ 同理（都是 bot 写的元数据）。
    paths-ignore:
      - 'data/state/**'
      - 'diagnostics/**'
      - 'automation/**'
      - 'docs/**'
  schedule:
    - cron: '17 */6 * * *'   # 加速期结束，回到可持续节奏 —— 投递安全网；健康驱动的修复由 self-heal 负责
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Self-heal health gate (skip deploy if already healthy)
      if: github.event_name == 'schedule'
      id: healthgate
      run: |
        # "监测"环节：定时任务先检查线上状态，健康则跳过重部署（避免无效重建）
        code=$(curl -sk -o /tmp/health.json -w '%{http_code}' --max-time 20 https://aishield.tools/api/v1/health || true)
        echo "health_http=$code"
        if [ "$code" = "200" ]; then
          if grep -q '"status": "ok"' /tmp/health.json; then
            echo "Server healthy (HTTP $code). Skipping redeploy on this cycle."
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "Server degraded (HTTP ${code:-unreachable}). Triggering auto-repair deploy."
        echo "deploy_needed=true" >> "$GITHUB_OUTPUT"

    - name: Deploy via SSH
      id: deploy
      if: steps.healthgate.outputs.deploy_needed != 'false'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 20m
        capture_stdout: true
        script: |
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null || true

          # 【2026-08-28 修复】本机访问 raw.githubusercontent.com 极慢（实测单次
          # curl 挂起 5 分钟后失败），而 git 走 github.com 是通的且很快。
          # 旧实现把「拿最新脚本」完全押在 raw 上：一旦超时，磁盘上仍是旧脚本，
          # 于是每次部署都在跑旧逻辑 —— 这是线上长期停留在 4.2.0 的直接原因。
          # 现改为：git 为主（保证拿到最新脚本），raw 仅作 best-effort 兜底且限时。
          echo "Updating repo via git (primary)..."
          git fetch --all 2>&1 | tail -2 || true
          git reset --hard origin/main 2>&1 | tail -2 || git pull origin main 2>&1 | tail -3 || true

          echo "Trying raw download (best-effort, 30s cap)..."
          if curl -sL --max-time 30 --connect-timeout 10 \
               "https://raw.githubusercontent.com/lm203688/aishield/main/scripts/deploy-named-tunnel.sh" \
               -o /tmp/deploy-named-tunnel.sh && [ -s /tmp/deploy-named-tunnel.sh ]; then
            mv /tmp/deploy-named-tunnel.sh scripts/deploy-named-tunnel.sh
            echo "raw download OK"
          else
            echo "raw download failed/skipped -> using git version"
            rm -f /tmp/deploy-named-tunnel.sh
          fi
          chmod +x scripts/deploy-named-tunnel.sh

          echo "=== Script first 5 lines ==="
          head -5 scripts/deploy-named-tunnel.sh
          echo "=== Checking for DNS API fix ==="
          grep -c "所有模式" scripts/deploy-named-tunnel.sh || echo "DNS API fix NOT found!"
          echo "=== Running deploy ==="
          bash scripts/deploy-named-tunnel.sh 2>&1
          echo "DEPLOY_EXIT_CODE=$?"

    - name: Run server diagnostics via SSH
      if: always()
      continue-on-error: true
      env:
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
      run: |
        mkdir -p ~/.ssh diagnostics
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

        ssh -o StrictHostKeyChecking=no -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "
          echo '=== DIAGNOSTIC ==='
          echo 'Time:' \$(date)
          echo '=== USER ==='
          whoami
          echo '=== GIT LOG ==='
          cd /opt/aishield 2>/dev/null && git log --oneline -3 2>&1 || echo 'NO GIT REPO'
          echo '=== SCRIPT CHECK ==='
          head -5 /opt/aishield/scripts/deploy-named-tunnel.sh 2>/dev/null || echo 'SCRIPT NOT FOUND'
          echo '=== API STATUS ==='
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo 'OK' || echo 'FAIL'
          echo '=== CLOUDFLARED PROCESS ==='
          ps aux | grep cloudflared | grep -v grep || echo 'NOT RUNNING'
          echo '=== CLOUDFLARED LOG (last 30 lines) ==='
          tail -30 /tmp/cloudflared.log 2>/dev/null || echo 'NO LOG'
          echo '=== DEPLOY LOG ==='
          cat /tmp/aishield-deploy.log 2>/dev/null || echo 'NO DEPLOY LOG'
          echo '=== TUNNEL INFO ==='
          echo 'Tunnel ID:' \$(cat /root/.cloudflared/tunnel-id 2>/dev/null || echo 'NOT SET')
          echo 'Token File:' \$(ls -la /root/.cloudflared/tunnel-token 2>/dev/null || echo 'NOT SET')
          echo 'cert.pem:' \$(ls -la /root/.cloudflared/cert.pem 2>/dev/null || echo 'NOT FOUND')
          echo '=== SYSTEMD STATUS ==='
          systemctl status cloudflared-tunnel 2>/dev/null | head -10 || echo 'NO SERVICE'
          echo '=== PORTS ==='
          ss -tlnp 2>/dev/null | grep -E ':(8450) ' || echo 'NO PORTS'
          echo '=== CRONTAB ==='
          crontab -l 2>/dev/null | grep -v '^#' || echo 'NO CRON'
          echo '=== START SCRIPT ==='
          cat /opt/start-tunnel.sh 2>/dev/null || echo 'NO START SCRIPT'
        " > diagnostics/deploy-result.md 2>&1

        echo "=== Diagnostics file size: $(wc -c < diagnostics/deploy-result.md) bytes ==="
        head -80 diagnostics/deploy-result.md

    - name: Capture deploy state (machine-readable)
      if: always()
      env:
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
      run: |
        mkdir -p ~/.ssh diagnostics
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

        # 【2026-08-29】部署验证门之前只判断「服务活着」，于是恒绿：
        # 进程活着但跑的是旧代码、规则文件没部署上去，门禁一样全过。
        # 要让门有约束力，必须让 VPS 自己报出「磁盘上的真实状态」，
        # 再和「线上自报的运行状态」逐字段比对。这里抓的就是磁盘侧真相。
        ssh -o StrictHostKeyChecking=no -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" '
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null || exit 3
          python3 - <<PYSTATE
          import json, os, subprocess
          def sh(cmd):
              try:
                  return subprocess.check_output(cmd, shell=True,
                         stderr=subprocess.DEVNULL, timeout=15).decode().strip()
              except Exception:
                  return ""
          disk_commit = sh("git rev-parse --short HEAD") or None
          try:
              from scanner.rules import get_rule_count, get_rule_breakdown
              disk_rules, breakdown = get_rule_count("mcp"), get_rule_breakdown()
          except Exception as exc:
              disk_rules, breakdown = None, {"error": str(exc)}
          try:
              meta = json.load(open(".deploy_meta.json"))
          except Exception:
              meta = {}
          print(json.dumps({
              "disk_commit": disk_commit,
              "disk_rules_count": disk_rules,
              "disk_rules_breakdown": breakdown,
              "deploy_meta": meta,
              "data_files": sorted(os.listdir("data")) if os.path.isdir("data") else [],
          }, ensure_ascii=False))
          PYSTATE
        ' > diagnostics/deploy-state.json 2>/dev/null || echo '{"disk_commit": null}' > diagnostics/deploy-state.json

        echo "=== deploy-state.json ==="
        cat diagnostics/deploy-state.json

    - name: Test HTTPS from runner
      if: always()
      continue-on-error: true
      run: |
        echo "" >> diagnostics/deploy-result.md
        echo "=== HTTPS Test from Runner ===" >> diagnostics/deploy-result.md
        echo "Time: $(date)" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== curl test (aishield.tools) ===" >> diagnostics/deploy-result.md
        curl -sk --max-time 15 https://aishield.tools/api/v1/health >> diagnostics/deploy-result.md 2>&1 || echo "FAILED" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== DNS lookup ===" >> diagnostics/deploy-result.md
        dig +short aishield.tools >> diagnostics/deploy-result.md 2>&1 || echo "dig failed" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== DNS CNAME check ===" >> diagnostics/deploy-result.md
        dig aishield.tools CNAME +short >> diagnostics/deploy-result.md 2>&1 || echo "no CNAME" >> diagnostics/deploy-result.md

    - name: Commit diagnostics to repo
      if: always()
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add diagnostics/deploy-result.md diagnostics/deploy-state.json data/state/ 2>/dev/null || true
        git commit -m "chore: update deploy diagnostics [skip ci]" || echo "No changes to commit"
        git pull --rebase --autostash origin main || true
        git push || echo "Push failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 部署后验证闸门：补齐"部署→验证"缺口 ───────────────────────────
  # 原版部署完就结束，从不确认线上是否真的好了。部署成功 ≠ 服务可用。
  post-deploy-verify:
    name: Post-Deploy Verification Gate
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Verify live service (真门禁：逐字段比对线上与磁盘)
      id: verify
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      run: |
        # 【2026-08-29 修复】原实现只判断「服务活着」：
        #   进程活着但跑旧代码     -> 通过
        #   规则数据文件没部署上去 -> 通过
        # 这个门从建成起就没拦下任何东西。恒定输出的门禁 = 没门禁。
        # 现在改成四条硬断言，任一不满足即 exit 1（阻断部署判定为成功）：
        #   1) 线上服务健康
        #   2) 线上 commit  == VPS 磁盘 commit      —— 部署是否真的落地
        #   3) 线上 rules  == VPS 磁盘 rules        —— 规则数据是否同步
        #   4) 线上 deployed_at 非空               —— .deploy_meta.json 是否写成功
        # 磁盘侧真相来自上一步从 VPS 抓回的 diagnostics/deploy-state.json，
        # 与线上侧同一时刻读，因此不存在「部署与验证之间被 bot 提交插队」的竞态。

        # ── 线上侧：多重试（部署后进程可能需要几秒才起来）──
        LIVE_JSON=""
        for i in $(seq 1 9); do
          LIVE_JSON=$(curl -sk --max-time 15 https://aishield.tools/api/v1/health 2>/dev/null || true)
          if printf '%s' "$LIVE_JSON" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
            echo "✅ 线上服务健康（第 $i 次探测）"
            break
          fi
          echo "等待线上服务就绪... ($i/9)"
          sleep 20
        done
        mkdir -p diagnostics
        printf '%s' "$LIVE_JSON" > diagnostics/_live.json
        echo "$LIVE_JSON"

        # ── 判定 ──
        python3 - <<'PYVERDICT'
        import json, sys

        def load(p):
            try:
                return json.load(open(p, encoding="utf-8"))
            except Exception:
                return {}

        live = load("diagnostics/_live.json")
        disk = load("diagnostics/deploy-state.json")

        failures = []

        if live.get("status") != "ok":
            failures.append("线上服务不健康（9 次探测后仍未就绪）")
        else:
            # 2) commit 一致性
            lc = live.get("commit") or ""
            dc = disk.get("disk_commit") or ""
            print(f"commit     : 线上={lc or '—'}  磁盘={dc or '—'}")
            if not dc:
                print("⚠️  未取到磁盘 commit（SSH 抓取失败），该断言跳过")
            elif lc != dc:
                failures.append(
                    f"部署未落地：线上 commit={lc or '空'}，VPS 磁盘 commit={dc}。"
                    f"通常意味着进程未重启（仍在跑旧代码）。")

            # 3) 规则数一致性
            lr, dr = live.get("rules_count"), disk.get("disk_rules_count")
            print(f"rules_count: 线上={lr}  磁盘={dr}")
            if dr is None:
                print("⚠️  未取到磁盘规则数，该断言跳过")
            elif lr != dr:
                failures.append(
                    f"规则数据未同步：线上={lr}，VPS 磁盘={dr}。"
                    f"磁盘明细={disk.get('disk_rules_breakdown')}，"
                    f"data/ 目录={disk.get('data_files')}")

            # 4) 部署标记
            da = live.get("deployed_at")
            print(f"deployed_at: {da or '（空）'}")
            if not da:
                failures.append(
                    "deployed_at 为空：.deploy_meta.json 未写入仓库根。"
                    "commit 判据正在退化为 git 实时回退值，部署陈旧性无法可靠判定。")

            # 规则构成明细（信息性输出，便于事后对照）
            print(f"线上规则构成: {live.get('rules_breakdown')}")

        for msg in failures:
            print("❌ " + msg)
        if failures:
            sys.exit(1)
        print("✅ 四项断言全部通过：线上与磁盘一致")
        PYVERDICT
        verdict=$?

        if [ "$verdict" != "0" ]; then
          python scripts/notify.py --level P0 --force \
            --fingerprint deploy-verify-failed \
            --title "部署后验证失败：线上与磁盘状态不一致" \
            --body "部署流程已执行，但线上运行状态与 VPS 磁盘真实状态不一致（commit / 规则数 / 部署标记）。详见 run ${{ github.run_id }} 的 Verify 步骤与 diagnostics/deploy-state.json。" \
            || true
          exit 1
        fi

        python scripts/notify.py --resolve --fingerprint deploy-verify-failed \
          --title "部署后验证恢复" --body "线上 commit 与规则数已与 VPS 磁盘一致，.deploy_meta.json 正常写入。" || true

    - name: Record deploy state
      if: always()
      run: |
        python scripts/state_bus.py set selfheal '{"last_deploy_verify":"${{ steps.verify.outcome }}","deploy_run_id":"${{ github.run_id }}"}' --source deploy-server
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/state/ 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "auto: 部署验证状态回写 [skip ci]" || true
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
        fi

name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /opt/aishield || cd ~/aishield
          git pull origin main
          python3 -m py_compile api/server.py eco/*.py scanner/*.py

          # ── 重启 API 服务 ──
          pkill -f "api/server.py" || true
          sleep 2
          export PORT=8450
          export CREEM_API_KEY=${{ secrets.CREEM_API_KEY }}
          export CREEM_WEBHOOK_SECRET=${{ secrets.CREEM_WEBHOOK_SECRET || 'whsec_28uK7ZQhVAhdcgvdhYF4Ac' }}
          export CREEM_TEST_MODE=${{ secrets.CREEM_TEST_MODE || 'true' }}
          nohup python3 api/server.py > server.log 2>&1 &
          sleep 3

          # ── 确保 Cloudflare Tunnel 运行 ──
          if ! pgrep -x cloudflared > /dev/null 2>&1; then
            echo "cloudflared not running, attempting to start..."
            # 尝试 systemd 服务
            if systemctl is-enabled cloudflared 2>/dev/null; then
              sudo systemctl start cloudflared
            else
              # 检查是否存在 tunnel 配置
              if [ -f /etc/cloudflared/config.yml ] || [ -f ~/.cloudflared/config.yml ]; then
                nohup cloudflared tunnel run > /tmp/cloudflared.log 2>&1 &
                echo "cloudflared started via nohup"
              else
                echo "WARNING: cloudflared config not found, tunnel not started"
              fi
            fi
          else
            echo "cloudflared already running (pid: $(pgrep -x cloudflared))"
          fi
          sleep 2

          # ── 验证 ──
          curl -sf http://localhost:8450/api/v1/health && echo "API OK"
          pgrep -x cloudflared && echo "Tunnel OK" || echo "WARNING: Tunnel not running"

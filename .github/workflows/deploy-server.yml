name: Deploy to Production Server

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'   # 加速期每小时（2026-08-31 回滚至 '17 */4 * * *'）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Self-heal health gate (skip deploy if already healthy)
      if: github.event_name == 'schedule'
      id: healthgate
      run: |
        # "监测"环节：定时任务先检查线上状态，健康则跳过重部署（避免无效重建）
        code=$(curl -sk -o /tmp/health.json -w '%{http_code}' --max-time 20 https://aishield.tools/api/v1/health || true)
        echo "health_http=$code"
        if [ "$code" = "200" ]; then
          if grep -q '"status": "ok"' /tmp/health.json; then
            echo "Server healthy (HTTP $code). Skipping redeploy on this cycle."
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "Server degraded (HTTP ${code:-unreachable}). Triggering auto-repair deploy."
        echo "deploy_needed=true" >> "$GITHUB_OUTPUT"

    - name: Deploy via SSH
      id: deploy
      if: steps.healthgate.outputs.deploy_needed != 'false'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 20m
        capture_stdout: true
        script: |
          cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null || true

          # Always download latest script from GitHub (git reset unreliable on this server)
          echo "Downloading latest deploy script..."
          curl -sL "https://raw.githubusercontent.com/lm203688/aishield/main/scripts/deploy-named-tunnel.sh" -o scripts/deploy-named-tunnel.sh
          chmod +x scripts/deploy-named-tunnel.sh

          echo "=== Script first 5 lines ==="
          head -5 scripts/deploy-named-tunnel.sh
          echo "=== Checking for DNS API fix ==="
          grep -c "所有模式" scripts/deploy-named-tunnel.sh || echo "DNS API fix NOT found!"
          echo "=== Running deploy ==="
          bash scripts/deploy-named-tunnel.sh 2>&1
          echo "DEPLOY_EXIT_CODE=$?"

    - name: Run server diagnostics via SSH
      if: always()
      continue-on-error: true
      env:
        SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
      run: |
        mkdir -p ~/.ssh diagnostics
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

        ssh -o StrictHostKeyChecking=no -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "
          echo '=== DIAGNOSTIC ==='
          echo 'Time:' \$(date)
          echo '=== USER ==='
          whoami
          echo '=== GIT LOG ==='
          cd /opt/aishield 2>/dev/null && git log --oneline -3 2>&1 || echo 'NO GIT REPO'
          echo '=== SCRIPT CHECK ==='
          head -5 /opt/aishield/scripts/deploy-named-tunnel.sh 2>/dev/null || echo 'SCRIPT NOT FOUND'
          echo '=== API STATUS ==='
          curl -sf http://127.0.0.1:8450/api/v1/health 2>/dev/null && echo 'OK' || echo 'FAIL'
          echo '=== CLOUDFLARED PROCESS ==='
          ps aux | grep cloudflared | grep -v grep || echo 'NOT RUNNING'
          echo '=== CLOUDFLARED LOG (last 30 lines) ==='
          tail -30 /tmp/cloudflared.log 2>/dev/null || echo 'NO LOG'
          echo '=== DEPLOY LOG ==='
          cat /tmp/aishield-deploy.log 2>/dev/null || echo 'NO DEPLOY LOG'
          echo '=== TUNNEL INFO ==='
          echo 'Tunnel ID:' \$(cat /root/.cloudflared/tunnel-id 2>/dev/null || echo 'NOT SET')
          echo 'Token File:' \$(ls -la /root/.cloudflared/tunnel-token 2>/dev/null || echo 'NOT SET')
          echo 'cert.pem:' \$(ls -la /root/.cloudflared/cert.pem 2>/dev/null || echo 'NOT FOUND')
          echo '=== SYSTEMD STATUS ==='
          systemctl status cloudflared-tunnel 2>/dev/null | head -10 || echo 'NO SERVICE'
          echo '=== PORTS ==='
          ss -tlnp 2>/dev/null | grep -E ':(8450) ' || echo 'NO PORTS'
          echo '=== CRONTAB ==='
          crontab -l 2>/dev/null | grep -v '^#' || echo 'NO CRON'
          echo '=== START SCRIPT ==='
          cat /opt/start-tunnel.sh 2>/dev/null || echo 'NO START SCRIPT'
        " > diagnostics/deploy-result.md 2>&1

        echo "=== Diagnostics file size: $(wc -c < diagnostics/deploy-result.md) bytes ==="
        head -80 diagnostics/deploy-result.md

    - name: Test HTTPS from runner
      if: always()
      continue-on-error: true
      run: |
        echo "" >> diagnostics/deploy-result.md
        echo "=== HTTPS Test from Runner ===" >> diagnostics/deploy-result.md
        echo "Time: $(date)" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== curl test (aishield.tools) ===" >> diagnostics/deploy-result.md
        curl -sk --max-time 15 https://aishield.tools/api/v1/health >> diagnostics/deploy-result.md 2>&1 || echo "FAILED" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== DNS lookup ===" >> diagnostics/deploy-result.md
        dig +short aishield.tools >> diagnostics/deploy-result.md 2>&1 || echo "dig failed" >> diagnostics/deploy-result.md
        echo "" >> diagnostics/deploy-result.md
        echo "=== DNS CNAME check ===" >> diagnostics/deploy-result.md
        dig aishield.tools CNAME +short >> diagnostics/deploy-result.md 2>&1 || echo "no CNAME" >> diagnostics/deploy-result.md

    - name: Commit diagnostics to repo
      if: always()
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add diagnostics/deploy-result.md data/state/ 2>/dev/null || true
        git commit -m "chore: update deploy diagnostics [skip ci]" || echo "No changes to commit"
        git pull --rebase --autostash origin main || true
        git push || echo "Push failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 部署后验证闸门：补齐"部署→验证"缺口 ───────────────────────────
  # 原版部署完就结束，从不确认线上是否真的好了。部署成功 ≠ 服务可用。
  post-deploy-verify:
    name: Post-Deploy Verification Gate
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Verify live service (引用 self-heal 状态 + 兜底探测)
      id: verify
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      run: |
        # 优化：先读 self-heal 的最近探测结果，避免重复探测
        # 如果 self-heal 在 5 分钟内探测过且健康，直接引用
        ok=false
        if [ -f data/state/health.json ]; then
          last_check=$(python -c "
          import json, sys
          try:
              d = json.load(open('data/state/health.json'))
              c = d.get('current', {})
              if c.get('healthy'):
                  print('healthy')
              else:
                  print('unhealthy')
          except:
              print('unknown')
          " 2>/dev/null)
          if [ "$last_check" = "healthy" ]; then
            echo "✅ self-heal 最近探测健康，直接引用状态"
            ok=true
          fi
        fi

        # 兜底：如果 self-heal 状态不可用，自己探测
        if [ "$ok" != "true" ]; then
          echo "self-heal 状态不可用，执行独立探测..."
          for i in $(seq 1 9); do
            if python scripts/health_probe.py >/dev/null 2>&1; then
              echo "✅ 部署后验证通过（第 $i 次探测）"
              ok=true
              break
            fi
            sleep 20
          done
        fi

        if [ "$ok" != "true" ]; then
          python scripts/notify.py --level P0 --force \
            --fingerprint deploy-verify-failed \
            --title "部署后验证失败：线上服务不可用" \
            --body "部署流程已执行，但 3 分钟轮询内线上服务始终未通过三路健康探测。请检查 run ${{ github.run_id }}。"
          exit 1
        fi
        python scripts/notify.py --resolve --fingerprint deploy-verify-failed \
          --title "部署后验证恢复" --body "本次部署已通过线上验证。" || true

    - name: Record deploy state
      if: always()
      run: |
        python scripts/state_bus.py set selfheal '{"last_deploy_verify":"${{ steps.verify.outcome }}","deploy_run_id":"${{ github.run_id }}"}' --source deploy-server
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/state/ 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "auto: 部署验证状态回写 [skip ci]" || true
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
        fi

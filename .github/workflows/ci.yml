name: AIShield CI/CD

on:
  push:
    branches: [ main, dev ]
    # 阻断自激回路：ci-state job 会把 data/state/ci.json 提交回 main，
    # 而 main 的 push 又会重新触发本 workflow。每次状态回写都白烧一轮 Actions
    # 配额，且失败时 notify-on-failure 还会重复建告警 issue。状态总线回写
    # 不应触发 CI；diagnostics/ 与 automation/ 同理（都是 bot 写的元数据）。
    paths-ignore:
      - 'data/state/**'
      - 'diagnostics/**'
      - 'automation/**'
      - 'docs/intel/**'
      - '_logs*'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '8 3 * * *'  # 每日一次兜底；push/PR 已覆盖日常校验，不需要每小时
  workflow_dispatch:      # 补齐手动触发，故障时可立即补跑而无需等下一个 cron

jobs:
  # 门禁：任何工作流 YAML 语法错误 / 依赖断链 / 缺失脚本都在此拦截
  # 缘由：self-heal-closed-loop.yml 曾因 YAML 语法错静默失效 48 天
  workflow-lint:
    name: Workflow Integrity Gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install YAML parser
      run: pip install pyyaml

    - name: Validate all workflows
      run: python scripts/validate_workflows.py

    # 版本曾在 6 处声明位漂移出 3 个不同值（4.0.0 / 4.1.0 / 4.2.0），
    # 导致各分发渠道各自宣称不同版本，出问题时无法定位用户跑的是哪份代码
    - name: Assert version consistency
      run: |
        if ! python scripts/sync_version.py --check; then
          echo "::error::版本声明不一致"
          echo "修复方式：本地运行 python scripts/sync_version.py --sync 并提交"
          exit 1
        fi

    # server.json 的 description 上限 100 字符这类约束，
    # 服务端只回一句笼统的 400，必须在提交前校验
    - name: Validate MCP registry manifest
      run: python scripts/validate_registry.py --check --offline

    # 台账必须与实际 workflow 一致，否则「28 个任务在跑」的幻觉会再次出现
    - name: Assert task registry is up to date
      run: |
        if ! python scripts/gen_task_registry.py --check; then
          echo "::error::automation/task-registry.md 已过期"
          echo "修复方式：本地运行 python scripts/gen_task_registry.py 并提交"
          python scripts/gen_task_registry.py
          git --no-pager diff --stat automation/task-registry.md || true
          exit 1
        fi

  # 分发门禁：对外发布物（distribution/ 下各渠道 artifact）必须过自家扫描器，
  # 否则阻断合并。与 gh_push.py 内门禁构成双保险，杜绝「自带洞」漏出。
  distribution-gate:
    name: Distribution Artifact Gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run distribution gate
      run: python scripts/verify_distribution.py

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run syntax check
      run: |
        python -m py_compile api/server.py eco/*.py scanner/*.py scripts/*.py

    - name: Run quick tests
      run: |
        python tests/quick_test.py

    - name: Run all tests
      run: |
        python tests/run_all.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run self-scan (local mode, no network)
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from scanner.engine import scan
        import json
        result = scan({
            'type': 'mcp_server',
            'name': 'aishield-self-test',
            'description': 'AIShield self scan test',
            'tools': [
                {'name': 'audit', 'description': 'Security audit tool'},
                {'name': 'prompt_check', 'description': 'Prompt injection detection'}
            ]
        })
        print(json.dumps(result, indent=2, ensure_ascii=False))
        score = result.get('score', 0)
        print(f'Self-scan score: {score}')
        if score < 0:
          print('Scan returned negative score')
          exit(1)
        print('Self-scan passed')
        "

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for external dependencies
      run: |
        if [ -f requirements.txt ]; then
          echo "Warning: requirements.txt detected."
          exit 1
        fi
        if grep -rq "^import requests\|^import numpy\|^import pandas\|^import flask\|^import fastapi" --include="*.py" . 2>/dev/null; then
          echo "External dependencies detected in code."
          exit 1
        fi
        echo "Zero-dependency check passed."

  performance-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Benchmark scan performance (local mode)
      run: |
        python -c "
        import time, sys
        sys.path.insert(0, '.')
        from scanner.engine import scan
        start = time.time()
        result = scan({
            'type': 'mcp_server',
            'name': 'perf-test',
            'description': 'Performance benchmark',
            'tools': [
                {'name': 'tool_a', 'description': 'Test tool A'},
                {'name': 'tool_b', 'description': 'Test tool B'}
            ]
        })
        duration = time.time() - start
        print(f'Scan completed in {duration:.2f}s')
        print(f'Overall score: {result.get(\"score\", \"N/A\")}')
        if duration > 5:
          print(f'Warning: Scan took {duration:.2f}s (limit: 5s)')
          exit(1)
        print('Performance check passed')
        "

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t aishield:test .

    - name: Run Docker container (API server mode)
      run: |
        docker run -d -p 8450:8450 --name aishield-test \
          --entrypoint python aishield:test /app/api/server.py

    - name: Health check (retry up to 30s)
      run: |
        for i in $(seq 1 6); do
          if curl -sf http://localhost:8450/api/v1/health > /tmp/health.json 2>/dev/null; then
            python -m json.tool /tmp/health.json && echo "Health OK" && exit 0
          fi
          echo "Waiting for container... ($i/6)"
          sleep 5
        done
        echo "Container health check failed after 30s"
        docker logs aishield-test --tail 30 2>&1 || true
        exit 1

    - name: Cleanup
      if: always()
      run: |
        docker stop aishield-test 2>/dev/null || true
        docker rm aishield-test 2>/dev/null || true

  # 状态总线：CI 完成后写入 data/state/ci.json，下游 workflow（feature-closed-loop 等）可读取，
  # 避免"下游重复跑测试 / 因 ci.json 不存在而静默失败"。
  # 这是跨-workflow 闭环的核心枢纽——所有 Act 层的运行结果汇总到此处。
  ci-state:
    name: Write CI State to Bus
    needs: [workflow-lint, distribution-gate, test, security-scan, dependency-check, performance-test, docker-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compute overall result
        id: result
        run: |
          # 任一核心 job 失败 / 被取消 → 整体失败
          #
          # 【2026-08-29 修复】上一版用 for 循环去动态拼 needs.<job>.result，
          # 表达式里嵌了 shell 变量。Actions 的表达式在 workflow 加载时就静态
          # 求值，不允许 shell 变量 -> 整个 ci.yml 在解析阶段被拒绝
          # （Unexpected symbol: '$job' within expression: needs.<job>.result）。
          #
          # 症状极具误导：run 名退化为 .github/workflows/ci.yml、零 job、秒红，
          # 看起来像「CI 全红」，实际是「CI 从来没跑过」。17/17 次全因此失败，
          # 而门禁脚本本地是绿的，所以极难发现。
          #
          # 还踩了一个二次坑：**GitHub 连 YAML 注释里的 Actions 表达式标记
          # 也照样求值。** 本注释里若写下那条坏表达式的字面量，会立刻把同一个
          # 解析错误重新引进来（已实测复现）；而写一个空的表达式标记占位，
          # 会换成另一个错（An expression was expected，同样导致整个文件无法
          # 加载，也已实测复现）。
          # 故此处一律用文字描述，不出现任何表达式标记的字面量。
          #
          # 现改用官方支持的 needs.*.result 数组 + contains()，不依赖 shell
          # 变量插值，也不受 job id 里带连字符影响。
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "overall=failure" >> "$GITHUB_OUTPUT"
          else
            echo "overall=success" >> "$GITHUB_OUTPUT"
          fi
          echo "overall=${{ steps.result.outputs.overall }}"
      - name: Write ci.json to state bus
        run: |
          mkdir -p data/state
          python -c "
          import json, os
          data = {
              'updated': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'run_id': '${{ github.run_id }}',
              'sha': '${{ github.sha }}',
              'overall': '${{ steps.result.outputs.overall }}',
              'source': 'ci.yml',
              'jobs': {
                  'workflow-lint': '${{ needs.workflow-lint.result }}',
                  'distribution-gate': '${{ needs.distribution-gate.result }}',
                  'test': '${{ needs.test.result }}',
                  'security-scan': '${{ needs.security-scan.result }}',
                  'dependency-check': '${{ needs.dependency-check.result }}',
                  'performance-test': '${{ needs.performance-test.result }}',
                  'docker-test': '${{ needs.docker-test.result }}',
              }
          }
          with open('data/state/ci.json','w') as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          "
      - name: Commit ci state
        run: |
          git config user.name "aishield-bot"
          git config user.email "bot@aishield.local"
          git add data/state/ci.json
          if git diff --cached --quiet; then
            echo "ci.json 无变更"
          else
            git commit -m "chore(ci-state): 更新 CI 状态总线"
            git push origin main || echo "push failed"
          fi

  notify-on-failure:
    name: Notify on CI Failure
    needs: [workflow-lint, distribution-gate, test, security-scan, dependency-check, performance-test, docker-test]
    # 只在人为动作（push / PR / 手动）上告警。定时兜底跑挂了不该每小时刷屏——
    # 定时失败由 meta-monitor 汇总，人为改动失败才需要立刻有人看。
    if: failure() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // 标题不含 run id：否则每次失败都是"新标题"，去重永远不命中，
            // 于是每小时的红 CI 会堆出每小时一个新 issue。
            const title = '❌ AIShield CI 失败（持续告警）';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `run ${context.runId} (${context.eventName} @ ${context.sha.slice(0,7)}) 失败：${url}`
              });
              console.log(`已追评到 issue #${existing.number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `CI 流水线在 run ${context.runId} 失败，请查看：\n${url}\n\n后续失败会追加评论到本 issue。修复后请关闭。`,
              labels: ['ci','alert','automated']
            });
            console.log('已创建 CI 失败告警 issue');
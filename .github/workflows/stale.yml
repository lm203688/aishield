name: Stale Issues Manager
on:
  schedule:
    - cron: '26 2 * * *'   # 加速期结束，回到可持续节奏 —— issue 清理
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if ran recently (降频：每天实际执行一次)
        id: freq-check
        run: |
          # 加速期 cron 每小时触发，但实际每天才执行一次
          LAST_RUN=$(python3 -c "
          import json
          try:
              d = json.load(open('data/state/stale.json'))
              print(d.get('current', {}).get('last_run', ''))
          except:
              print('')
          " 2>/dev/null)
          if [ -n "$LAST_RUN" ]; then
            LAST_EPOCH=$(date -d "$LAST_RUN" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            DIFF=$((NOW_EPOCH - LAST_EPOCH))
            if [ "$DIFF" -lt 86400 ]; then
              echo "距上次运行 ${DIFF}s < 24h，跳过"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.freq-check.outputs.skip != 'true'

      - uses: actions/stale@v9
        if: steps.freq-check.outputs.skip != 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issue 配置
          stale-issue-message: |
            这个 Issue 已经 30 天没有活动了。如果问题仍然存在，请评论回复，否则将在 7 天后自动关闭。
            
            感谢你的贡献！
          close-issue-message: |
            这个 Issue 因长期无活动已被自动关闭。如果问题仍然存在，请重新打开或创建新 Issue。
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          # PR 配置
          stale-pr-message: |
            这个 PR 已经 45 天没有活动了。请更新状态或评论说明进展，否则将在 10 天后自动关闭。
          close-pr-message: |
            这个 PR 因长期无活动已被自动关闭。如需继续，请重新提交。
          days-before-pr-stale: 45
          days-before-pr-close: 10
          stale-pr-label: 'stale'
          # 排除标签
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,work-in-progress'
          # 不处理已分配的 Issue
          exempt-all-assignees: true

      - name: Detection summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --label stale --state open --limit 100 --json number -q 'length' 2>/dev/null || echo '?')
          echo "::notice::Stale 管理执行完成：当前 open 且带 stale 标签的 Issue 共 ${OPEN} 个"

      - name: Record last run time
        if: always()
        run: |
          python3 -c "
          import json, os
          state_dir = 'data/state'
          os.makedirs(state_dir, exist_ok=True)
          path = os.path.join(state_dir, 'stale.json')
          data = {'current': {'last_run': '$(date -u +%Y-%m-%dT%H:%M:%SZ)'}}
          with open(path, 'w') as f: json.dump(data, f)
          " 2>/dev/null || true
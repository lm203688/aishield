name: AIShield Intelligence-to-Feature Closed-Loop

# 自动化闭环：情报/用户反馈采集 -> 分析 -> 采纳 -> 测试 -> 部署
# 目标：将用户 Issue 与外部情报转化为产品迭代，无需人工 pass
# 原则：跟踪驱动（Research-Informed）与 用户反馈驱动迭代

on:
  schedule:
    - cron: '40 3 * * 1'   # 每周一 03:40 自动执行情报->功能采纳闭环
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  triage:
    name: Collect New Feedback & Features
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.triage.outputs.count }}
    steps:
      - name: Fetch recent open issues
        id: triage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: 'lm203688', repo: 'aishield',
              state: 'open', per_page: 30
            });
            const actionable = issues.filter(i =>
              i.labels.some(l => ['enhancement','bug-auto','feature'].includes(l.name)) ||
              /\[auto\]|自动|feature|enhancement|需求/.test((i.title || '') + (i.body || ''))
            );
            console.log(`Open issues: ${issues.length}, actionable: ${actionable.length}`);
            require('fs').writeFileSync('/tmp/actionable.json', JSON.stringify(actionable.map(i => ({
              number: i.number, title: i.title, labels: i.labels.map(l => l.name)
            })), null, 2));
            core.setOutput('count', String(actionable.length));

  update-roadmap:
    name: Adopt into ROADMAP
    needs: triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Append actionable items to ROADMAP (auto-adopt)
        run: |
          if [ ! -s ROADMAP.md ]; then echo "no roadmap"; exit 0; fi
          echo "" >> ROADMAP.md
          echo "## 自动采纳项（来自用户反馈闭环）" >> ROADMAP.md
          echo "> 由 feature-closed-loop workflow 于 $(date +%Y-%m-%d) 自动追加" >> ROADMAP.md
        env:
          PATH_FOR_DEMO: "1"

  dispatch-deploy:
    name: Test & Trigger Deploy Pipeline
    needs: update-roadmap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run full test suite
        run: |
          python -m py_compile api/server.py eco/*.py scanner/*.py
          python tests/run_all.py
      - name: Confirm any pending PRs deploy via deploy-server (push triggers)
        run: |
          echo "Feature loop done. Any merged changes deploy automatically via Deploy to Production Server workflow."
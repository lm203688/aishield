name: AIShield Intelligence-to-Feature Closed-Loop

# 自动化闭环：多源反馈采集 -> 聚合定级 -> 采纳写入 ROADMAP -> 建跟踪 Issue -> 测试 -> 落库
# 修复记录 F6：原版本 update-roadmap 只 echo 不 commit，闭环断在"采纳"环节
# 现版本：feedback_aggregator.py 真实写入 ROADMAP.md + data/state/feature.json 并 commit

on:
  schedule:
    - cron: '0 * * * *'   # 加速期每小时（2026-08-31 回滚至 '20 8 * * 1'）
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览不写入'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  aggregate:
    name: Aggregate Multi-Source Feedback
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.agg.outputs.count }}
      p0p1: ${{ steps.agg.outputs.p0p1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate feedback (4 sources)
        id: agg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/feedback_aggregator.py --dry-run | tee /tmp/agg.log
          else
            python scripts/feedback_aggregator.py --adopt | tee /tmp/agg.log
          fi
          COUNT=$(python -c "import json;d=json.load(open('data/state/feature.json'));print(d['current'].get('adopted',0))" 2>/dev/null || echo 0)
          P0P1=$(python -c "import json;d=json.load(open('data/state/feature.json'));print(d['current'].get('p1_count',0))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "p0p1=$P0P1" >> $GITHUB_OUTPUT
          echo "聚合结果: total=$COUNT p0p1=$P0P1"
          # 【2026-08-24 补】feature 状态域自 08-04 停更（无新反馈可采纳时不落盘），
          # 元监控 M3 误判"停摆"。每周期必写心跳：updated 刷新，数值不变则不刷 history。
          python scripts/state_bus.py set feature "{\"adopted\":$COUNT,\"p1_count\":$P0P1}" \
            --source feature-closed-loop || true

      - name: Upload aggregation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feedback-state
          path: |
            data/state/feature.json
            ROADMAP.md
          retention-days: 7

  verify:
    name: Verify Repo Still Green (引用 CI 状态，避免重复测试)
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check CI status (引用 ci.yml 最近结果)
        id: ci-check
        run: |
          # 优化：如果 ci.yml 最近 1 小时内跑过且成功，跳过重复测试
          SKIP=false
          if [ -f data/state/ci.json ]; then
            LAST=$(python -c "
          import json, sys
          try:
              d = json.load(open('data/state/ci.json'))
              c = d.get('current', {})
              print(c.get('last_status', 'unknown'))
          except:
              print('unknown')
          " 2>/dev/null)
            if [ "$LAST" = "success" ]; then
              echo "CI 最近成功，跳过重复测试"
              SKIP=true
            fi
          fi
          echo "skip_tests=$SKIP" >> $GITHUB_OUTPUT

      - name: Compile & test
        if: steps.ci-check.outputs.skip_tests != 'true'
        run: |
          python -m py_compile api/server.py scanner/*.py scripts/*.py
          python tests/run_all.py

      - name: Validate workflow syntax
        if: steps.ci-check.outputs.skip_tests != 'true'
        run: |
          pip install pyyaml
          python scripts/validate_workflows.py

      - name: Write CI status for downstream consumers
        if: always()
        run: |
          python scripts/state_bus.py set ci \
            --json "{\"last_status\":\"${{ steps.ci-check.outcome }}\",\"source\":\"feature-closed-loop\"}" \
            --source feature-closed-loop || true

  settle:
    name: Commit Adoption Result
    needs: [aggregate, verify]
    if: needs.aggregate.result == 'success' && needs.verify.result == 'success' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download aggregation artifacts
        uses: actions/download-artifact@v4
        with:
          name: feedback-state
          path: /tmp/agg

      - name: Apply and commit
        run: |
          cp /tmp/agg/feature.json data/state/feature.json 2>/dev/null || true
          cp /tmp/agg/ROADMAP.md ROADMAP.md 2>/dev/null || true
          git config user.name  "aishield-bot"
          git config user.email "bot@aishield.local"
          git add ROADMAP.md data/state/feature.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(feature-loop): 自动采纳 ${{ needs.aggregate.outputs.count }} 项反馈 (P0/P1: ${{ needs.aggregate.outputs.p0p1 }})"
            git pull --rebase --autostash origin main || true
            git push origin main
            echo "已提交采纳结果"
          fi

  alert:
    name: Alert on Loop Failure
    needs: [aggregate, verify, settle]
    if: always() && (needs.aggregate.result == 'failure' || needs.verify.result == 'failure' || needs.settle.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_OWNER: lm203688
          GH_REPO: aishield
        run: |
          {
            printf '%s\n' "功能迭代闭环执行失败，本周反馈未能采纳进 ROADMAP。"
            printf '%s\n' ""
            printf '%s\n' "- aggregate: ${{ needs.aggregate.result }}"
            printf '%s\n' "- verify: ${{ needs.verify.result }}"
            printf '%s\n' "- settle: ${{ needs.settle.result }}"
            printf '%s\n' ""
            printf '%s\n' "运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/loop_fail.md
          python scripts/notify.py --level P1 \
            --title "功能闭环执行失败" \
            --fingerprint "feature-loop-fail" \
            --body "$(cat /tmp/loop_fail.md)"

name: AIShield Rule Auto-Promoter

# 情报→规则的"最后一公里"：Tech Radar 每日起草候选到 scanner/_proposed/，
# 但 promote_rule.py 一直是手动动作，候选只进不出（2026-08-24 审计时已积压 43 条）。
# 本任务每日自动执行：六道闸门校验 → 批量晋升 → 全量测试 → 绿了入库 / 红了自动回滚并告警。
#
# 六道闸门（promote_rule.py 内置）：schema / 无 TODO / 正则可编译 / 不过宽 /
# 不与现网规则重复 / 良性语料零误报。
# 晋升落点 data/radar_rules.json 与 intel 再生的 generated_rules.json 相互独立，
# 威胁情报流水线不会抹掉雷达晋升的规则。

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rule-promoter
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Passing Candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 测试前置统一走 prepare-tests。本 job 是全链最危险的一环：它把候选规则
      # 写进线上规则库，唯一的刹车就是下面那次全量测试。若前置缺失，刹车会
      # 以"看起来像产品回归"的方式失效（实测干净 runner 上 18F/9E 全在身份侧）。
      - uses: ./.github/actions/prepare-tests

      - name: Gate report (--check；blocked=六道闸门未过，必须可见，不得吞)
        # 铁律：禁止 `|| true` 吞门禁失败。blocked（校验未过，如良性语料误报）
        # 必须红在 UI 上让人看见，而非静默全绿。用 continue-on-error 让红步
        # 可见但不阻断健康候选的晋升（真正把关的是下面的 --promote-all）。
        run: python scripts/promote_rule.py --check
        continue-on-error: true

      - name: Shadow verdict（只观测不写入：三档判定 promote / warn / refuse）
        # 为什么不复用上面的 --check：--check 只跑 schema 与良性语料，跑不跑
        # 攻击语料（catch）要等 --promote-all 落库之后才由 radar_effect 事后
        # 报告，而那个报告是非阻断的。结果是一条零命中的死规则会直接进线上，
        # 之后才被当作"带刺的铃铛"报出来 —— 这正是 shadow 档要提前看见的。
        #
        # 铁律照旧：禁止 `|| true` 吞失败。continue-on-error 只用于"红在 UI 上
        # 可见但不阻断健康候选晋升"，不是放行。它一个字都不写（--shadow 的契
        # 约，tests/test_promote_rule_shadow.py::TestShadowWritesNothing 钉死），
        # 所以可以放心挂在本步而不制造新的并发写者。
        #
        # 为什么不顺手加 --strict：--strict 会让零命中的新规则被拒收，而雷达
        # 候选来自新信号、ATTACK_SAMPLES 是固定语料，全新攻击类型天然不在其中。
        # 默认放行（并大声告警）是当前循环的既有契约，收紧留给有上下文的人
        # 手工做（见 docs/radar-shadow-gate.md）。
        run: python scripts/promote_rule.py --shadow
        continue-on-error: true

      - name: Promote all passing candidates
        id: promo
        run: |
          python scripts/promote_rule.py --promote-all | tee /tmp/promo.log
          N=$(grep -Eo '^promoted [0-9]+' /tmp/promo.log | grep -Eo '[0-9]+' | tail -1)
          echo "promoted=${N:-0}" >> "$GITHUB_OUTPUT"
          echo "本轮晋升规则数: ${N:-0}"

      - name: Full test suite（晋升必须保持全绿）
        id: test
        run: |
          if ! python tests/run_all.py; then
            echo "PROMO_TESTS=red" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "PROMO_TESTS=green" >> "$GITHUB_ENV"

      - name: Rollback promotion on red test
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # 安全阀：测试红了 = 本轮晋升引入回归。整体回退到晋升前状态，
          # 归档文件退回候选目录等待人工诊断，并发出 P1 告警附日志样本。
          git checkout -- data/radar_rules.json mcp-server/README.md 2>/dev/null || true
          if [ -d scanner/_proposed/promoted ]; then
            find scanner/_proposed/promoted -name '*.json' -exec mv {} scanner/_proposed/ \; 2>/dev/null || true
          fi
          {
            printf '%s\n' "规则自动晋升后全量测试转红，已自动回滚 data/radar_rules.json 并退回候选。"
            printf '%s\n' ""
            printf '%s\n' "- 本轮晋升数: ${{ steps.promo.outputs.promoted }}"
            printf '%s\n' "- 测试结果: ${{ steps.test.outcome }}"
            printf '%s\n' "- 运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md
          python scripts/notify.py --level P1 \
            --fingerprint rule-promotion-failed \
            --title "规则自动晋升被测试闸门回滚" \
            --body "$(cat /tmp/body.md)"
          exit 1

      - name: Commit promoted rules
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 心跳：rules 域每周期刷新（数值不变则不刷 history）
          RADAR_N=$(python -c "import json;print(len(json.load(open('data/radar_rules.json')).get('rules',{})))" 2>/dev/null || echo 0)
          python scripts/state_bus.py set rules "{\"radar_rules\":$RADAR_N,\"last_promoted\":${{ steps.promo.outputs.promoted }}}" --source rule-promoter || true
          # 注意：不要 git add data/state/ —— 整个状态目录是并发冲突磁铁（多个
          # workflow 同时写并 push），把它并进本次提交会让 rebase 产生内容冲突。
          # 晋升产物只涉及 radar_rules.json / _proposed / README，这些文件仅本
          # workflow 接触，无冲突。radar_effect.json 是唯一例外：它仅由本 workflow
          # 的 --promote-all（内部调用 radar_effect.evaluate）写入，单写者，无冲突，
          # 且 meta-monitor M9 需要从 main 读取它来检查"晋升规则是否误报"。
          git add data/radar_rules.json scanner/_proposed/ mcp-server/README.md data/state/radar_effect.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: 规则闸门自动晋升 ${{ steps.promo.outputs.promoted }} 条 [skip ci]"
            # 修复"只进不出"：并发 push 冲突曾被 `|| echo skipped` 静默吞掉，
            # 晋升结果永远进不了仓库（靠人工补 13 条）。统一走共享脚本带重试，
            # 重试耗尽才真 exit 1（触发 alert job），不再制造假绿门禁。
            bash scripts/git_push_safe.sh
          else
            echo "本周期无可晋升候选或无实际变化"
          fi

      - name: Clear alarm on green promotion
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # 恢复即关闭：晋升成功必须同时清掉两条指纹，否则 alert job 在
          # promote 崩溃时开的 "rule-promoter-crashed" 告警永远无人关闭
          # （04 号态：告警有了、恢复通知没有 → 闭环断一半）。
          # --resolve 在"无对应开启 Issue"时也返回 0，故无需吞失败（铁律：
          # 不放过真失败）。
          python scripts/notify.py --resolve \
            --fingerprint rule-promotion-failed \
            --title "规则晋升恢复" \
            --body "晋升后全量测试通过。"
          python scripts/notify.py --resolve \
            --fingerprint rule-promoter-crashed \
            --title "规则晋升任务恢复" \
            --body "promote job 本轮成功，历史崩溃告警关闭。"

  alert:
    name: Alert on Loop Failure
    needs: promote
    if: always() && needs.promote.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Escalate through notification bus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # promote job 内部已发 P1（rule-promotion-failed），此处兜底：
          # 任务本身崩溃（而非测试红）时也要有人知道。
          python scripts/notify.py --level P1 \
            --fingerprint rule-promoter-crashed \
            --title "规则晋升任务执行失败" \
            --body "promote job 结果: ${{ needs.promote.result }}。运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

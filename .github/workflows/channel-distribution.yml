name: AIShield Channel Distribution (Content + Registry + Social)

# 盈利化/推广：内容营销自动化 + MCP Registry 生态分发
# 原则：不做无分发渠道的功能；内容即增长；生态入口即用户
# 流程：生成内容(周报+案例分析+社交文案+feeds) -> 提交/更新 MCP Registry -> 有token则自动发社交

on:
  schedule:
    - cron: '0 6 * * 4'   # 每周四 06:00 自动产出并分发内容
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTENT_DIR: content/blog

jobs:
  content:
    name: Generate Content Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run content pipeline
        run: |
          python -m py_compile scripts/content_pipeline.py || true
          python scripts/content_pipeline.py --all 2>&1 | tail -30

      - name: Commit generated content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[full]"
          git config user.email "github-actions[full]@users.noreply.github.com"
          git add content/ api/static/feeds.xml 2>/dev/null
          if ! git diff --cached --quiet; then
            git commit -m "auto: 内容营销流水线产出 [skip ci]" || true
            git push origin main || echo "push skipped (no change)"
          else
            echo "No new content this cycle"
          fi

  registry:
    name: Update MCP Registry Presence
    runs-on: ubuntu-latest
    needs: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate registry submission manifests (preview)
        run: |
          python -m py_compile scripts/submit_mcp_directories.py || true
          # 预览模式：生成 registry 所需 JSON/manifest，确保生态可见性文档就绪
          python scripts/submit_mcp_directories.py 2>&1 | head -40

      - name: Publish social (token-gated)
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          if [ -n "$TWITTER_BEARER_TOKEN" ] && [ -n "$REDDIT_CLIENT_ID" ]; then
            echo "社交 token 已配置，执行正式发布"
            python scripts/social_publish.py --publish 2>&1 | tail -30 || echo "publish encountered issues (logged)"
          else
            echo "未配置社交 token，跳过自动发布（内容已生成，待配置后启用）"
          fi
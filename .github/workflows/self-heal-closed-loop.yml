name: AIShield Auto Self-Heal Closed-Loop

# 自动化核心闭环：监测 → 诊断 → 修复 → 测试 → 部署 → 验证 → 升级/销案
# 目标：服务异常时无需人工参与，自动完成修复全链路并确认结果
#
# 【2026-08-04 重大修复】
#   原版 escalate.needs 指向 "verify"，但 verify 是 repair job 内部的 step id，
#   不是 job。GitHub Actions 在解析期即报 "depends on unknown job"，
#   导致整个 workflow 从未运行过一次 —— 自愈机制 48 天处于未开机状态。
#   本版将 verify 拆为独立 job，重建合法依赖链，并补齐：
#     1) 测试失败必须阻断部署（原 continue-on-error 让测试形同虚设）
#     2) 结论回写状态总线（机器可读，供元监控与日报消费）
#     3) 恢复后自动销案关闭 Issue（原版只会开 Issue 不会关，告警只增不减）

on:
  schedule:
    - cron: '23 */6 * * *'   # 降频：每 6 小时心跳，仍能在 6h 内感知故障
  workflow_dispatch:
    inputs:
      force_repair:
        description: '强制执行修复流程（即使服务健康）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: self-heal
  cancel-in-progress: false

env:
  SERVICE_URL: https://aishield.tools/api/v1/health

jobs:
  # ── 阶段 1：监测与诊断（三路探测，杜绝单点误判）────────────────────
  probe:
    name: 1-Monitor & Diagnose
    runs-on: ubuntu-latest
    outputs:
      degraded: ${{ steps.probe.outputs.degraded }}
      level: ${{ steps.probe.outputs.level }}
      http: ${{ steps.probe.outputs.http }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Three-way health probe
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/health_probe.py --notify
          rc=$?
          set -e
          level=$(python -c "import json;print(json.load(open('data/state/health.json'))['current'].get('level','unknown'))" 2>/dev/null || echo unknown)
          http=$(python -c "import json;print(json.load(open('data/state/health.json'))['current'].get('http',''))" 2>/dev/null || echo "")
          echo "level=$level"  >> "$GITHUB_OUTPUT"
          echo "http=$http"    >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "degraded=true"  >> "$GITHUB_OUTPUT"
          else
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist health state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/selfheal.json data/state/health.json  2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: 健康探测事实回写 [skip ci]" || true
            bash scripts/git_push_safe.sh
          fi

  # ── 阶段 2：自动修复 ──────────────────────────────────────────────
  repair:
    name: 2-Auto Repair
    needs: probe
    if: needs.probe.outputs.degraded == 'true' || inputs.force_repair
    runs-on: ubuntu-latest
    outputs:
      attempted: ${{ steps.deploy.outputs.attempted }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate (代码层面自检)
        run: |
          python -m py_compile api/server.py scanner/*.py scripts/*.py
          for f in eco/*.py; do python -m py_compile "$f" || exit 1; done

      # 【2026-09-18 修复】原实现让 VPS 自己 `git pull origin main` 同步代码，
      # 但 VPS 到 github.com 的网络已被实证不通（09-06 部署日志铁证：fetch 失败被
      # 吞掉后 reset 到陈旧的本地 origin/main 引用，线上长期停在旧代码）。
      # 结果：「自愈」跑的是 VPS 磁盘上的陈旧脚本 —— 用旧代码修旧代码，
      # 新版本引入的问题永远修不好（09-17~09-18 的 502 失活即此路径之一）。
      # 现与 deploy-server.yml 对齐：runner 打包 tarball 经 SSH 投递，
      # git pull 仅作 tarball 未送达时的兜底。
      - name: Upload code tarball to VPS
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::warning::未配置服务器凭据，跳过 tarball 投递"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar czf /tmp/aishield-code.tgz --exclude=.git .
          ls -la /tmp/aishield-code.tgz
          scp -o StrictHostKeyChecking=no -P "${SERVER_PORT:-22}" \
            /tmp/aishield-code.tgz "$SERVER_USER@$SERVER_HOST":/tmp/aishield-code.tgz
          echo "tarball 上传完成"

      - name: Redeploy to server
        id: deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::warning::未配置服务器凭据，跳过远程修复"
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SERVER_SSH_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> /tmp/known_hosts 2>/dev/null || true

          # 【2026-09-18 修复】原实现有三处叠加的假绿，导致故障不可见且永不修好：
          #   1) `... | tail -60 || echo "REPAIR_SSH_FAILED"` —— 管道让 step 的成功/
          #      失败取决于 tail 的退出码，SSH 断连与部署失败都被吞成 success；
          #   2) 部署脚本本身无条件 `exit 0`（API 状态 FAIL 也报成功），
          #      所以 job 结论是 success，只有独立的 verify 判红；
          #   3) `tail -40` 截掉了 STEP 1（API 启动段），而故障恰好只在那里 ——
          #      三次自愈（09-17 11:53/17:09/21:31 UTC）STEP 8 全部报
          #      `--- API (localhost:8450) --- FAIL`，但 STEP 1 的启动输出
          #      从未出现在任何日志里，根因因此无人可见。
          # 现改为：完整日志落盘并全量输出、退出码如实传递、artifact 留存。
          mkdir -p /tmp/repair-artifact
          set -o pipefail
          set +e
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/known_hosts -i /tmp/id_rsa \
            -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/aishield 2>/dev/null || cd ~/aishield 2>/dev/null || { echo 'FATAL: 目标目录不存在'; exit 1; }; \
             echo '=== VPS 预检 ==='; \
             echo \"user=\$(whoami) dir=\$(pwd) deploy_sha=$DEPLOY_SHA\"; \
             if [ -s /tmp/aishield-code.tgz ]; then \
               tar xzf /tmp/aishield-code.tgz -C . && rm -f /tmp/aishield-code.tgz && echo 'tarball unpacked OK（权威代码源 = runner checkout 产物）'; \
             else \
               echo 'WARN: tarball 未送达，回退 git pull（VPS 到 github.com 网络可能不通）'; \
               git pull origin main 2>&1 | tail -8 || echo 'WARN: git pull 失败，磁盘维持旧代码'; \
             fi; \
             chmod +x scripts/deploy-named-tunnel.sh; \
             DEPLOY_SHA=$DEPLOY_SHA bash scripts/deploy-named-tunnel.sh; \
             rc=\$?; \
             echo '=== /tmp/aishield-api.log 末尾 40 行 ==='; \
             tail -40 /tmp/aishield-api.log 2>/dev/null || echo '(无 API 日志)'; \
             echo '=== /tmp/cloudflared.log 末尾 20 行 ==='; \
             tail -20 /tmp/cloudflared.log 2>/dev/null || echo '(无 cloudflared 日志)'; \
             echo '=== 进程快照 ==='; \
             ps aux | grep -E 'api/server.py|cloudflared' | grep -v grep || echo '(无相关进程)'; \
             echo '=== 本机端口与外网连通 ==='; \
             (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':(22|8450)\b' || true; \
             echo \"localhost:8450 -> \$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8450/api/v1/health 2>/dev/null || echo unreachable)\"; \
             echo \"aishield.tools -> \$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 https://aishield.tools/api/v1/health 2>/dev/null || echo unreachable)\"; \
             exit \$rc" 2>&1 | tee /tmp/repair-artifact/repair.log
          rc=$?
          set -e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload repair log (诊断证据留存)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-repair-log
          path: /tmp/repair-artifact/repair.log
          if-no-files-found: ignore
          retention-days: 14

  # ── 阶段 3：测试闸门（失败即阻断，不允许带病上线）──────────────────
  test:
    name: 3-Test Gate
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 测试前置统一走 prepare-tests。本 job 是"修复后必须全绿才上线"的闸门：
      # 前置缺失会让闸门在错误前提下亮红，从而把真实修复也一起挡在门外。
      - uses: ./.github/actions/prepare-tests

      - name: Run full test suite (blocking)
        run: |
          # 关键：此处不设 continue-on-error。测试不过，绝不进入验证与放行。
          python tests/run_all.py

  # ── 阶段 4：验证闭环（独立 job，可被 escalate 合法依赖）──────────────
  verify:
    name: 4-Verify Recovery
    needs: [repair, test]
    runs-on: ubuntu-latest
    outputs:
      recovered: ${{ steps.verify.outputs.recovered }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Poll until recovered (max 4 min)
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            if python scripts/health_probe.py >/dev/null 2>&1; then
              echo "✅ 闭环成功：自动修复后服务已恢复（第 $i 次探测）"
              echo "recovered=true" >> "$GITHUB_OUTPUT"
              python scripts/notify.py --resolve --fingerprint service-health-down \
                --title "服务已恢复" --body "自愈闭环第 $i 次验证通过，服务恢复正常。"
              exit 0
            fi
            sleep 20
          done
          echo "❌ 修复后服务仍未恢复，移交升级流程"
          echo "recovered=false" >> "$GITHUB_OUTPUT"
          exit 1

  # ── 阶段 5：升级人工介入（仅当自动修复确实失败）─────────────────────
  escalate:
    name: 5-Escalate
    needs: [probe, repair, test, verify]
    # 【2026-09-18 修复】原条件只看 test/verify。repair 失败时 test 与 verify
    # 都会被 skip（而非 failure），于是 escalate 不触发 —— 修复环节挂了
    # 却没有任何告警。补上 repair。
    if: always() && (needs.repair.result == 'failure' || needs.test.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Raise P0 alert through notification bus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          reason="验证未通过（修复已下发但服务仍未恢复）"
          if [ "${{ needs.repair.result }}" = "failure" ]; then
            reason="修复环节失败（SSH 通道或部署脚本失败，服务未被触及）"
          elif [ "${{ needs.test.result }}" = "failure" ]; then
            reason="测试闸门未通过（代码存在回归，已阻断部署）"
          fi
          {
            printf '**失败原因：** %s\n\n' "$reason"
            printf -- '- 1-探测: %s (level=%s, http=%s)\n' \
              '${{ needs.probe.result }}' '${{ needs.probe.outputs.level }}' '${{ needs.probe.outputs.http }}'
            printf -- '- 2-修复: %s\n' '${{ needs.repair.result }}'
            printf -- '- 3-测试: %s\n' '${{ needs.test.result }}'
            printf -- '- 4-验证: %s\n' '${{ needs.verify.result }}'
            printf '\n运行记录: %s\n' \
              'https://github.com/lm203688/aishield/actions/runs/${{ github.run_id }}'
          } > /tmp/alert_body.md
          python scripts/notify.py --level P0 --force \
            --fingerprint self-heal-failed \
            --title "自愈闭环失败，需人工介入" \
            --body "$(cat /tmp/alert_body.md)"

  # ── 阶段 6：闭环结算（无论成败都回写状态，供元监控消费）──────────────
  settle:
    name: 6-Settle State
    needs: [probe, repair, test, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Write selfheal state
        run: |
          python scripts/state_bus.py set selfheal '{
            "probe": "${{ needs.probe.result }}",
            "repair": "${{ needs.repair.result }}",
            "test": "${{ needs.test.result }}",
            "verify": "${{ needs.verify.result }}",
            "degraded_detected": "${{ needs.probe.outputs.degraded }}",
            "run_id": "${{ github.run_id }}"
          }' --source self-heal-closed-loop

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/selfheal.json data/state/health.json  2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: 自愈闭环状态结算 [skip ci]" || true
            bash scripts/git_push_safe.sh
          fi

name: Acquisition Automation

on:
  schedule:
    # 加速期：每小时（2026-08-31 回滚至 '12 1 * * 1' + '42 1 * * *'）
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  content-pipeline:
    if: github.event.schedule != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Content Pipeline
        run: |
          python scripts/content_pipeline.py --all
      
      - name: Commit Generated Content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/ api/static/feeds.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: weekly content pipeline [$(date +%Y-%m-%d)]"
          git push

  acquisition-monitor:
    if: github.event.schedule != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Acquisition Monitor
        run: |
          python scripts/acquisition_monitor.py
      
      - name: Check Alerts
        id: alerts
        run: |
          python scripts/acquisition_monitor.py --alert || echo "ALERTS_FOUND=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-report
          path: api/data/acquisition_report.json
      
      - name: Notify on Alerts
        if: steps.alerts.outputs.ALERTS_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `📉 获客指标告警 (run ${context.runId})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (issues.find(i => i.title === title && !i.pull_request)) { console.log('已有告警'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `获客指标触发告警阈值，请查看 acquisition_report.json。\n运行链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['acquisition','alert','automated']
            });
            console.log('已创建获客指标告警 issue');

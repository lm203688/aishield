name: "AIShield Security Scan"
description: "AI Agent 安全生态基础设施 - 256+ 规则扫描 Trust Attestation 生成，OWASP MCP Top 10 + Agentic ASI01-10 对齐"
author: "lm203688"
branding:
  icon: "shield"
  color: "blue"
inputs:
  source_url:
    description: "待扫描的仓库 URL 或本地路径；留空则扫描 CI 检出的工作区（/github/workspace）"
    required: false
    default: ""
  tool_type:
    description: "工具类型：mcp / skill / gpt / prompt / all"
    required: false
    default: "mcp"
  name:
    description: "工具名称（可选，用于报告与 badge）"
    required: false
    default: ""
  enable_osv:
    description: "是否联网查询 OSV.dev 实时 CVE（默认关闭，隐私/限流优先）"
    required: false
    default: "false"
  fail_on:
    description: "达到该风险级别则使 CI 失败：safe / medium / high / critical"
    required: false
    default: "high"
  include_trust_attestation:
    description: "生成 Trust Attestation 中立信任凭证"
    required: false
    default: "false"
    type: boolean
  output_format:
    description: "输出格式：json / sarif / text"
    required: false
    default: "sarif"
    type: choice
    options:
      - "json"
      - "sarif"
      - "text"
outputs:
  score:
    description: "总体安全评分 (0-100)"
    value: ${{ steps.scan.outputs.score }}
  risk_level:
    description: "风险级别 safe/medium/high/critical"
    value: ${{ steps.scan.outputs.risk_level }}
  report:
    description: "JSON 扫描报告路径"
    value: ${{ steps.scan.outputs.report }}
  sarif:
    description: "SARIF 文件路径（可上传 GitHub Security tab）"
    value: ${{ steps.scan.outputs.sarif }}
  trust_attestation:
    description: "Trust Attestation 凭证 JSON"
    value: ${{ steps.scan.outputs.trust_attestation }}
runs:
  using: "node20"
  main: "dist/index.js"
  pre:
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build the action
        run: npm run build
  
  post:
    steps:
      - name: Upload SARIF to GitHub Security
        if: always() && steps.scan.outputs.output_format == 'sarif'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      
      - name: Generate Trust Attestation
        if: always() && inputs.include_trust_attestation == 'true'
        run: |
          # 生成 Trust Attestation
          echo "Trust attestation generation completed"
          echo "trust_attestation=aishield-trust-attestation.json" >> $GITHUB_OUTPUT

name: "AIShield Security Scan"
description: "AI Agent 安全生态基础设施 - 313+ 规则扫描 Trust Attestation 生成，OWASP MCP Top 10 + Agentic ASI01-10 对齐"
author: "lm203688"
branding:
  icon: "shield"
  color: "blue"
inputs:
  source_url:
    description: "待扫描的仓库 URL 或本地路径；留空则扫描 CI 检出的工作区（/github/workspace）"
    required: false
    default: ""
  tool_type:
    description: "工具类型：mcp / skill / gpt / prompt / all"
    required: false
    default: "mcp"
  name:
    description: "工具名称（可选，用于报告与 badge）"
    required: false
    default: ""
  enable_osv:
    description: "是否联网查询 OSV.dev 实时 CVE（默认关闭，隐私/限流优先）"
    required: false
    default: "false"
  fail_on:
    description: "达到该风险级别则使 CI 失败：safe / medium / high / critical"
    required: false
    default: "high"
  output_format:
    description: "输出格式：json / sarif / text"
    required: false
    default: "sarif"
  include_trust_attestation:
    description: "生成带完整性锚点的扫描裁决（Trust Attestation 中立信任凭证）"
    required: false
    default: "false"
outputs:
  score:
    description: "总体安全评分 (0-100)"
  risk_level:
    description: "风险级别 safe/medium/high/critical"
  report:
    description: "JSON 扫描报告路径"
  sarif:
    description: "SARIF 文件路径（可上传 GitHub Security tab）"
  trust_attestation:
    description: "带完整性锚点的扫描裁决 JSON 路径"
runs:
  using: "docker"
  image: "Dockerfile"
  env:
    INPUT_SOURCE_URL: ${{ inputs.source_url }}
    INPUT_TOOL_TYPE: ${{ inputs.tool_type }}
    INPUT_NAME: ${{ inputs.name }}
    INPUT_ENABLE_OSV: ${{ inputs.enable_osv }}
    INPUT_FAIL_ON: ${{ inputs.fail_on }}
    INPUT_OUTPUT_FORMAT: ${{ inputs.output_format }}
    INPUT_INCLUDE_TRUST_ATTESTATION: ${{ inputs.include_trust_attestation }}
